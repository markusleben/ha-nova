name: NOVA Relay
version: "0.6.0"
slug: ha_nova_relay
description: Thin Home Assistant relay for WS proxy and skill workflows
url: https://github.com/markusleben/ha-nova
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ingress: true
# Ingress serves the owner-only NOVA console on an internal, unmapped port so it
# is never reachable from the LAN; 8791/8792 are the public transport ports.
ingress_port: 8793
ingress_entry: /home
ports:
  # OPAQUE pairing bootstrap + legacy HTTP access. Device credentials are never
  # accepted here — only over the TLS port below.
  8791/tcp: 8791
  # Pinned TLS 1.3 for all device-credential traffic. Its mapped host port is
  # read back from Supervisor self-info and pinned into each pairing response.
  8792/tcp: 8792
ports_description:
  8791/tcp: Relay pairing + legacy HTTP
  8792/tcp: Relay secure device API (TLS)
# TCP liveness only: /health requires bearer auth, an HTTP watchdog would 401-loop.
watchdog: tcp://[HOST]:[PORT:8791]
homeassistant_api: true
hassio_api: true
hassio_role: default
panel_icon: mdi:star-four-points
panel_title: NOVA
panel_admin: true

# Read-write access to the Home Assistant configuration directory. The relay
# only USES it when the file_access option is set (default: off), so mapping it
# here does not grant anything by itself.
map:
  # The mount path is pinned explicitly: the shorthand form mounts at a
  # type-derived default that differs across Supervisor versions, and the relay
  # would then find no config directory and silently fall back to file_access:
  # off — the feature would look enabled and do nothing.
  - type: homeassistant_config
    read_only: false
    path: /config

options:
  relay_auth_token: null
  ha_llat: ""
  file_access: "off"

schema:
  relay_auth_token: password?
  ha_llat: password?
  file_access: list(off|read|readwrite)?
