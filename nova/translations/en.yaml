configuration:
  relay_auth_token:
    name: Relay Auth Token (legacy/advanced)
    description: >-
      Existing installs may keep their shared relay token here.
      New installs should leave this empty: the App creates and
      persists a private token for pairing automatically.
  ha_llat:
    name: Home Assistant Access Token (legacy migration only)
    description: >-
      Leave this EMPTY for a normal App install: the App authenticates to
      Home Assistant automatically via its Supervisor token. This field only
      exists so an older install that already stored a Long-Lived Access Token
      keeps it for a one-time migration; do not create a new token here.
      Standalone Container/Core deployments set HA_LLAT in the server
      environment instead.
  file_access:
    name: File access (advanced)
    description: >-
      Lets HA NOVA read and edit configuration FILES that have no
      Home Assistant API — template, REST and command-line sensors,
      packages and themes. Leave this OFF unless you want that:
      off = no file access at all (default),
      read = HA NOVA may read configuration files,
      readwrite = it may also change them (every write backs up the
      previous version first). Secrets, the database and Home
      Assistant's internal storage are never accessible in any mode, and
      HA NOVA can never write code (custom_components, python_scripts,
      www) — only configuration files.

network:
  8791/tcp: Relay HTTP API
