version: 2

project_name: ha-nova

builds:
  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - cloudremote_official
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  # The curated release header below is the complete user-facing changelog.
  # Appending commit-derived groups duplicates headings and can displace the
  # intended bug-fix highlights in the installed update digest.
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  # Keep every asset invisible until release.yml has built and uploaded the
  # complete installer set. Failed jobs replace this draft on retry; only the
  # separate final publish job makes it public.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  mode: replace
  name_template: "HA NOVA v{{.Version}}"
  header: |
    {{ if .Prerelease }}## Preview / Release Candidate

    This is a release candidate for installer and onboarding testing. Stable users should ignore this prerelease; normal `ha-nova update` stays on stable.

    Install this exact RC (release-pinned for this tag):

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows uses a single supported install path: `install.ps1`. Return an RC install to stable later with `ha-nova update`; if it reports that it needs admin rights, rerun the stable Windows install command instead.
    {{ else }}**Update the NOVA App to 0.13.2.** It brings the chat-app changes below to Claude and ChatGPT and to the NOVA page, and Apps and logs to HA NOVA on your computer, which asks for it too.

    - In Home Assistant: Settings > Apps > NOVA Relay > Update.
    - Then in ChatGPT: open chatgpt.com/plugins, choose HA NOVA, then Refresh.
    - Claude asks once more before HA NOVA's tools: set them again as the NOVA page says. With a phone linked for chat apps, every tool on "Always allow"; without one, all but "Run a confirmed change".
    - A change you previewed before the update needs a new preview.

    ## New Features

    - **Chat apps do what HA NOVA on a computer does.** Rooms, names, helpers, scenes, dashboards, integrations, files (with file access on), and more. Only setup and InfluxDB history stay outside the chat.
    - **Chat apps for everyone in your home.** On the NOVA page, pick who else may use them, each with their own login: Ask only, Use the home, or Manage everything. A level never goes above their Home Assistant role.
    - **Use the home never gets a chat code.** Unlocking, opening a garage door or gate, and turning off the alarm need a tap on the person's own phone. Without one, they're refused.
    - **Each person confirms on their own phone.** On the NOVA page, link, change, or stop yours under "Your phone", others' in their row. The phone linked now OKs a change or stop first; a new phone OKs its link on itself.
    - **Confirmations in your home's language.** Is Home Assistant set to German? Then confirmations are in German, on the phone too, with Home Assistant's own words, like Automation or Verriegelt. Other languages get English.
    - **One confirmation for up to 20 automation and script changes.** Deletes too. The window names every item and what happens to it; the phone shows how many and the riskiest one. Undo now covers the last 25 changed items.
    - **More of Home Assistant's settings.** Integrations, repairs, users, general settings, backup schedule, Labs, statistics import, deleting a device or blueprint. Preview first; deletes and sensitive changes take your OK.
    - **Apps and their logs, on HA OS.** Read Supervisor, Core, host, and App logs; install or remove an App, or change its settings, after your own OK. Also in chat apps; on a computer, not through Home Assistant Link.
    - **"Your setup" when you run setup again.** What is done and what is left, with a button for each open step (in the terminal, its command). Another AI app on this computer can use HA NOVA too: setup shows what to paste.
    - **Recent changes from chat apps.** The NOVA page lists the last 20, newest first: who asked, what changed, and whether their phone or a chat code confirmed it.
    - **Setup can move to another Home Assistant.** When something needs a fix, "Use another Home Assistant" asks for the new address. Without a key, setup no longer says the NOVA App doesn't answer.
    - **Claude stops asking before every step, if you let it.** The setup page and the NOVA page say what to set: with a phone linked for chat apps, every tool on "Always allow"; without one, all but "Run a confirmed change".
    - **Setup finds Codex in the ChatGPT desktop app too.** On a Mac, also without the codex command. Doctor flags an older HA NOVA copy that Codex would load; setup updates it, or moves HA NOVA's own old copies to a backup.
    - **Clearer confirmations for technical requests.** Common MQTT and Supervisor requests, like renaming a Zigbee device or restarting an App, now open with what they do in your home, then the details.

    ## What To Watch

    - **HACS installs and updates, and dashboard resources, now take your own confirmation, like a delete.** In chat apps and on a computer. HACS code runs in Home Assistant, a dashboard resource in every signed-in browser.
    - **Moving a device with a lock to another room takes your own confirmation.** Also for an alarm panel, garage door, gate, or door, and for labels: an automation that opens a whole room would reach it.
    - **The NOVA Relay App asks for more Supervisor access.** It needs it for Apps and logs. Home Assistant lowers the App's security rating by one.
    - **Going back to an older NOVA App refuses every chat request while others are on the chat-app list.** To go back, first untick everyone but you on the NOVA page and save.

    ## Bug Fixes

    - **Answered on the computer, the phone's question disappears.** The first answer counts. An answer in the window no longer leaves a result note on the phone.
    - **Changes now work in homes with Nuki locks.** Nuki, for one, gives Home Assistant number IDs. HA NOVA couldn't read them, so many changes and the phone setup failed. It now reads number IDs too.
    - **Setup asks whose phone should confirm on this computer.** It lists every administrator's phone with its person and picks none for you. A person whose entity is disabled in Home Assistant no longer hides their phone.
    - **Setup's optional questions stay readable.** In the terminal, their answers stay on screen after setup ends, and a cancelled Link sign-in no longer skips the phone and the other questions.
    - **Camera sign-in tokens stay hidden from the AI.** A camera's or image's short-lived token opens its picture or live video without a login. It no longer reaches the AI, also not through a trace or an ordinary template.
    - **A leftover Home Assistant Link is explained.** Setup says what it is and lets you finish or remove it right there. Doctor no longer stops at it: it checks the rest and shows both ways out.
    - **Setup says which Claude gets HA NOVA.** Claude Code is the claude command and the Code tab in Claude Desktop. Setup replaces an old HA NOVA there. On a Mac, Claude Desktop alone is enough once its Code tab was opened.
    - **Setup explains the owner sign-in.** The owner connects each computer once; then anyone who uses that login on it can use HA NOVA. On the NOVA page, other admins see who the owner is.
    - **Disabling a lock's device is refused.** So is an alarm panel's or garage door's, and removing or disabling the integration or switch one runs on: it would stop working. Do that in Home Assistant's settings.

    Stable install commands are release-pinned for this tag.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows 11 on ARM, install from the x64 PowerShell; the installer lists the steps.
    Windows uses a single supported install path: `install.ps1`.
    Do not download and run the raw `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets directly; those are installer payloads, not the supported end-user path.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
    {{ end }}
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
