version: 2

project_name: ha-nova

builds:
  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - cloudremote_official
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  # The curated release header below is the complete user-facing changelog.
  # Appending commit-derived groups duplicates headings and can displace the
  # intended bug-fix highlights in the installed update digest.
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  # Keep every asset invisible until release.yml has built and uploaded the
  # complete installer set. Failed jobs replace this draft on retry; only the
  # separate final publish job makes it public.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  mode: replace
  name_template: "HA NOVA v{{.Version}}"
  header: |
    {{ if .Prerelease }}## Preview / Release Candidate

    This is a release candidate for installer and onboarding testing. Stable users should ignore this prerelease; normal `ha-nova update` stays on stable.

    Install this exact RC (release-pinned for this tag):

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows uses a single supported install path: `install.ps1`. Return an RC install to stable later with `ha-nova update`; if it reports that it needs admin rights, rerun the stable Windows install command instead.
    {{ else }}**Update the NOVA App to 0.13.23.** It brings the fixes below to Claude and ChatGPT, and HA NOVA on your computer asks for it too.

    - In Home Assistant: Settings > Apps > NOVA Relay > Update.
    - No Update button yet? In Home Assistant: Settings > ⋮ (top right) > Check for updates. Or, at home, run `ha-nova doctor`: it does that for you and offers the update.
    - A big change you previewed before the update may need a new preview.

    ## What To Watch

    - **Setup no longer updates an installed NOVA App.** When it is too old, setup shows the steps in Home Assistant, and `ha-nova update` asks in the terminal. This way an update can't set off an automation you didn't see.

    ## Bug Fixes

    - **Reading the weather, a calendar or a to-do list no longer pulls unrelated automations into the check.** A script that only reads the weather no longer makes HA NOVA ask about what reacts to the weather.
    - **A check that runs out of time says so.** A big check on a slow connection usually gets more time now. If that's not enough, it says so and suggests trying again or smaller steps. You're still asked to confirm.
    - **`ha-nova doctor` finds a new NOVA App right away.** It asks Home Assistant to look, instead of waiting up to 3 hours. If something reacts to that, it gives the steps instead. `ha-nova update` does the same from now on.
    - **To-do changes no longer show an internal code.** The list of changes in the preview still showed the item's code next to its name.
    - **After you create or change an automation or script, HA NOVA offers a test preview in one line.** Say yes to see what would switch before anything runs.
    - **On big homes, checking a change to an automation finishes much sooner.** HA NOVA reads your other automations the way Home Assistant runs them, so a big check over Home Assistant Link takes far less time.
    - **An automation built from a blueprint is now checked with its own extra actions.** If it adds one, such as unlocking a door, HA NOVA asks for the confirmation that action needs.
    - **Confirmations stay in your language when a check runs out of time.** A big check that ran out of time could ask in English, in the window and on your phone too.
    - **Confirming no longer waits past the promised time.** On a slow connection the window or phone could ask only after a long recheck. Now the ask ends in time, and nothing changes without your answer.
    - **`ha-nova doctor` over Home Assistant Link names the Check for updates step.** Before, it only pointed to the Update button, which appears only once Home Assistant has looked.

    Stable install commands are release-pinned for this tag.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows 11 on ARM, install from the x64 PowerShell; the installer lists the steps.
    Windows uses a single supported install path: `install.ps1`.
    Do not download and run the raw `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets directly; those are installer payloads, not the supported end-user path.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
    {{ end }}
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
