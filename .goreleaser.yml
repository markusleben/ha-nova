version: 2

project_name: ha-nova

builds:
  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - cloudremote_official
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  # The curated release header below is the complete user-facing changelog.
  # Appending commit-derived groups duplicates headings and can displace the
  # intended bug-fix highlights in the installed update digest.
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  # Keep every asset invisible until release.yml has built and uploaded the
  # complete installer set. Failed jobs replace this draft on retry; only the
  # separate final publish job makes it public.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  mode: replace
  name_template: "HA NOVA v{{.Version}}"
  header: |
    {{ if .Prerelease }}## Preview / Release Candidate

    This is a release candidate for installer and onboarding testing. Stable users should ignore this prerelease; normal `ha-nova update` stays on stable.

    Install this exact RC (release-pinned for this tag):

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows uses a single supported install path: `install.ps1`. Return an RC install to stable later with `ha-nova update`; if it reports that it needs admin rights, rerun the stable Windows install command instead.
    {{ else }}## What To Watch

    - **Update the NOVA Relay App too.** This release needs Relay 0.10.0: update it under Settings > Apps > NOVA Relay (Container/Core: pull the new image). Until then HA NOVA warns that the Relay is outdated.
    - **Confirm outside the chat.** Unlocks, gates, garages, alarm disarms, restarts, and automation, script, or dashboard deletes open a confirmation window or ask your linked phone. Other deletes take a four-digit code.
    - **Window and phone settings.** `ha-nova setup confirm-window off` turns the window off. `ha-nova setup confirm-phone` links one phone; once linked, an action it can't reach is refused instead of falling back to chat.
    - **Some low-level changes are refused.** Firing custom events or webhooks, Z-Wave/Zigbee/Alarmo settings, and custom HACS repositories: use the HA UI. For an event, HA NOVA offers to run the automation itself.
    - **Home Assistant Link.** Home Assistant Cloud is becoming Home Assistant Link, and HA NOVA says Link now. Commands stay `ha-nova cloud …`; until the rename reaches your HA, it is under Settings > Home Assistant Cloud.
    - **No re-pairing needed.** Paired computers keep their connection. Still on the old shared access? It works in this release and the next: re-pair once with `ha-nova pair`, then revoke it on the NOVA page.
    - **Device control has one explicit fast path.** Unambiguous everyday actions run right away and are verified afterwards, also for a room with exactly one matching device; everything else shows a preview first.
    - **More actions need confirmation.** Reloads, App and host control, template controls, ESPHome or MQTT buttons, YAML controls without a `unique_id`, and automation or script deletes, one confirmation per item.
    - **`ha-nova uninstall` keeps the shared App.** It asks whether this is the last computer using HA NOVA before guiding removal of the NOVA Relay App, which would disconnect every computer.
    - **Leaner: the optional Census is removed.** It was always opt-in and off by default. The CLI removes its old local setting on first run; `ha-nova census` is gone.
    - **Windows: update with the install command once.** `ha-nova update` from 0.25.x asks for admin rights or fails; run the Windows install command below. After that, no admin prompt.
    - **Testing the release candidate?** A plan shown before this update has to be made again. Previews and codes from the earlier version are refused, and nothing is sent.

    ## New Features

    - **Sign in with Home Assistant to pair.** Setup opens your Home Assistant login: sign in as the owner and this computer connects by itself. As another user, or over SSH on Linux, the six-digit code from NOVA still works.
    - **Confirm in a window or on your phone.** A click on your computer or a tap on your linked phone (Companion app) confirms unlocks and automation, script, or dashboard deletes, so your AI assistant never sees a code.
    - **Easier setup.** One link opens the NOVA Relay App page and adds the repository, a running App is skipped, and setup ends with a first look at your home and prompts with your own names.
    - **Know your home with exact numbers.** Ask "what do I have?", "where is this sensor used?", or "review my whole setup": HA NOVA counts rooms, devices, automations, and low batteries itself.
    - **Replace a device or a phone.** Automations, scripts, scenes, dashboards, helpers, energy sources, and notifications move to the new device in one reviewed plan; if it takes over the old entity ids, history continues.
    - **Build whole dashboards.** Views and cards, with your installed custom cards. Every change is previewed, a copy is saved first, and "undo that" restores it. "Check my dashboards" finds broken cards.
    - **Move rules to Home Assistant.** Node-RED, Homey, SmartThings, Hubitat, or openHAB rules and old YAML become native automations; the old rule stays disabled, not deleted, until the new one checks out.
    - **ESPHome device configs.** HA NOVA explains a device file and flags removed keys, impossible pins, and passwords in the file. With file access on, edits show the change first and save a copy.
    - **Undo a deleted automation or script.** "Undo that" right after a delete restores it under its original id, with the usual preview.
    - **Changes sent once and verified.** `ha-nova call`, `plan`, and `apply` send each change exactly once, show automation and script diffs, and read the result back; a confirmed plan is re-checked first.
    - **Quick read-only lookups.** `ha-nova find`, `get`, and `history` find entities by name, alias, domain, or current state ("which lights are on?"), read a state or config, and summarize history.
    - **Faster, more reliable Relay App updates.** Installs and updates download a ready image instead of building on your Home Assistant device.

    ## Bug Fixes

    - **YAML and package automations are read properly.** They are read through their loaded config, so one YAML automation without an id no longer forces confirmation on unrelated actions.
    - **Made-up services are refused.** A service Home Assistant does not list is refused before any preview, and HA NOVA names the real buttons or services that fit instead.
    - **The Relay stops hammering a rejected token.** A revoked Home Assistant token no longer causes an endless reconnect loop, and a stalled login can no longer block later requests.
    - **Headless Linux works end to end.** `ha-nova uninstall --purge` works without an unlocked keyring, and Codex CLI and OpenCode can use `ha-nova setup --service <client>` on headless machines and over SSH.
    - **fish shell support.** The installer puts `ha-nova` on your PATH in fish too, and uninstall removes every PATH entry it added.
    - **Windows update and uninstall need no admin rights.** No admin prompt, no helper files left in `%TEMP%`, and a failed update launch removes its download.
    - **Windows setup explains its firewall prompt.** HA NOVA says the Windows Firewall question on a first setup comes from its search for Home Assistant. Cancel is fine: setup goes on, and you can type the address.
    - **A clear next step when secure storage is out of reach.** Over SSH or as admin on Windows and macOS, setup, `pair`, `doctor`, and `uninstall --purge` point to a desktop terminal; local installs don't blame Link.

    Stable install commands are release-pinned for this tag.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows 11 on ARM, install from the x64 PowerShell; the installer lists the steps.
    Windows uses a single supported install path: `install.ps1`.
    Do not download and run the raw `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets directly; those are installer payloads, not the supported end-user path.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
    {{ end }}
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
