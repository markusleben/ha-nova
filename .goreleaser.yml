version: 2

project_name: ha-nova

builds:
  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - cloudremote_official
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  # The curated release header below is the complete user-facing changelog.
  # Appending commit-derived groups duplicates headings and can displace the
  # intended bug-fix highlights in the installed update digest.
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  # Keep every asset invisible until release.yml has built and uploaded the
  # complete installer set. Failed jobs replace this draft on retry; only the
  # separate final publish job makes it public.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  mode: replace
  name_template: "HA NOVA v{{.Version}}"
  header: |
    {{ if .Prerelease }}## Preview / Release Candidate

    This is a release candidate for installer and onboarding testing. Stable users should ignore this prerelease; normal `ha-nova update` stays on stable.

    Install this exact RC (release-pinned for this tag):

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows uses a single supported install path: `install.ps1`. Return an RC install to stable later with `ha-nova update`.
    {{ else }}## What To Watch

    - **Cloud Remote is macOS-only in this release.** Windows and Linux clients keep full local functionality; Cloud Remote there stays disabled while per-platform validation infrastructure is unavailable.

    ## New Features

    - **Finish Cloud setup over SSH.** `ha-nova cloud add --remote-resume` resumes an existing verified authorization checkpoint from an SSH session. Starting a new authorization still needs a desktop session.
    - **Invalid integration credentials get a guided recovery.** HA NOVA previews and runs the entry reload that makes Home Assistant re-validate a failing credential, then continues the normal reauthentication handoff.
    - **Failed service calls now name the real cause.** An error that coincides with Home Assistant starting reauthentication for that integration is reported as exactly that, with a direct path into the recovery flow.

    ## Bug Fixes

    - **Automation suggestions are honest about what already exists.** Duplicate detection covers labels, groups, and blueprint inputs; a disabled automation is offered for enabling instead of being silently skipped.
    - **Replicating an automation to another room got stricter.** Disabled counterparts, room-bound group or label targets, and unsupported device triggers stop the copy instead of leaving a replica that never runs.

    Stable install commands are release-pinned for this tag.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows ARM64, use x64 emulation.
    Windows uses a single supported install path: `install.ps1`.
    Do not download and run the raw `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets directly; those are installer payloads, not the supported end-user path.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
    {{ end }}
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
