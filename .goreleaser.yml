version: 2

project_name: ha-nova

builds:
  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - cloudremote_official
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  # The curated release header below is the complete user-facing changelog.
  # Appending commit-derived groups duplicates headings and can displace the
  # intended bug-fix highlights in the installed update digest.
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  # Keep every asset invisible until release.yml has built and uploaded the
  # complete installer set. Failed jobs replace this draft on retry; only the
  # separate final publish job makes it public.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  mode: replace
  name_template: "HA NOVA v{{.Version}}"
  header: |
    {{ if .Prerelease }}## Preview / Release Candidate

    This is a release candidate for installer and onboarding testing. Stable users should ignore this prerelease; normal `ha-nova update` stays on stable.

    Install this exact RC (release-pinned for this tag):

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows uses a single supported install path: `install.ps1`. Return an RC install to stable later with `ha-nova update`; if it reports that it needs admin rights, rerun the stable Windows install command instead.
    {{ else }}**Update the NOVA App to 0.13.20.** It brings the fixes below to Claude and ChatGPT, and HA NOVA on your computer asks for it too.

    - In Home Assistant: Settings > Apps > NOVA Relay > Update.
    - A big change you previewed before the update may need a new preview.

    ## What To Watch

    - **Changes that need your own confirmation always ask through HA NOVA.** Some, like deletes or HACS downloads, could be confirmed in the chat alone. Now HA NOVA asks in its window, on your phone, or with its own code.
    - **More changes that set off an unlock ask you first.** If an automation reacting to a calendar event, helper, device or integration setting, rename or new zone unlocks a door, opens a gate or disarms, you're asked.

    ## Bug Fixes

    - **Renames on Home Assistant 2026.11 no longer repeat the device name.** "Sun Reading Lamp" on the device "Sun" no longer shows as "Sun Sun Reading Lamp". The preview shows the full name Home Assistant will show.
    - **A call no longer does less than its preview says.** Home Assistant 2026.11 lets a call leave devices out with an exclude list the preview didn't show. HA NOVA now refuses it; the AI names the devices instead.
    - **Integration setup asks only for what Home Assistant shows.** Since 2026.11, a setup form can hide fields depending on other answers. HA NOVA no longer asks for them or sends them.
    - **Removing or changing a to-do item names the item.** The preview showed an internal code instead of, say, "Milk".
    - **Windows: setup says when Claude Code lacks Git for Windows.** Claude Code works without it, but HA NOVA's start-up step in Claude Code needs it.
    - **Setup in the browser no longer asks for an AI app.** When you chose Claude or ChatGPT in the browser and setup finished in the terminal, it still told you to install an AI app.
    - **Pairing Zigbee, Z-Wave or Matter devices: HA NOVA shows the way.** It used to say pairing was impossible. It can't pair them yet, so it gives the steps in Home Assistant.
    - **Updated libraries.** The NOVA App and HA NOVA use current versions of their libraries, including fixes for reconnect hangs in the App's connection to Home Assistant.

    Stable install commands are release-pinned for this tag.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows 11 on ARM, install from the x64 PowerShell; the installer lists the steps.
    Windows uses a single supported install path: `install.ps1`.
    Do not download and run the raw `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets directly; those are installer payloads, not the supported end-user path.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
    {{ end }}
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
