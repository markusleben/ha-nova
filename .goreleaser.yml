version: 2

project_name: ha-nova

builds:
  - id: ha-nova-darwin
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  draft: false
  prerelease: auto
  name_template: "HA NOVA v{{.Version}}"
  header: |
    ## Install or Update

    Do not download the `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets below and try to run them directly.
    They are installer payloads, not standalone apps.
    Use the installer commands below, or run `ha-nova update` from an existing install.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/main/install.sh | bash
    ```

    **Windows (PowerShell):**
    ```powershell
    irm https://raw.githubusercontent.com/markusleben/ha-nova/main/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows ARM64, use x64 emulation.
    Windows validation in this release may still be narrower than macOS; check the README support matrix before claiming client-lane parity.

    Already installed? Run `ha-nova check-update` or `ha-nova update`.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
