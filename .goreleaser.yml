version: 2

project_name: ha-nova

builds:
  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - cloudremote_official
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  # The curated release header below is the complete user-facing changelog.
  # Appending commit-derived groups duplicates headings and can displace the
  # intended bug-fix highlights in the installed update digest.
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  # Keep every asset invisible until release.yml has built and uploaded the
  # complete installer set. Failed jobs replace this draft on retry; only the
  # separate final publish job makes it public.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  mode: replace
  name_template: "HA NOVA v{{.Version}}"
  header: |
    {{ if .Prerelease }}## Preview / Release Candidate

    This is a release candidate for installer and onboarding testing. Stable users should ignore this prerelease; normal `ha-nova update` stays on stable.

    Install this exact RC (release-pinned for this tag):

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows uses a single supported install path: `install.ps1`. Return an RC install to stable later with `ha-nova update`; if it reports that it needs admin rights, rerun the stable Windows install command instead.
    {{ else }}**Update the NOVA App to 0.13.24.** Claude and ChatGPT get this release's changes through it, and HA NOVA on your computer asks for it too.

    - In Home Assistant: Settings > Apps > NOVA Relay > Update.
    - No Update button yet? In Home Assistant: Settings > ⋮ (top right) > Check for updates. Or, at home, run `ha-nova doctor`: it does that for you and offers the update.
    - A big change you previewed before the update may need a new preview.
    - Using HA NOVA in ChatGPT? After the update, open chatgpt.com/plugins, choose HA NOVA, then Refresh. From this version on, the terminal reminds you after an App update.

    ## New Features

    - **Editing one of your own automations or scripts now runs right away when HA NOVA can put it back.** It says so, and "undo" restores it. New ones, deletes, and anything that unlocks still ask.
    - **Changing the same automation or script again right away no longer asks.** "Undo" takes back the latest change.
    - **Renaming a device or entity now runs right away and can be undone.** That covers its name and voice aliases. Locks, alarms, doors, gates, and garages still ask.
    - **Removing up to five items you named from the shopping list runs right away.**
    - **When a NOVA App update is waiting, setup in a terminal offers it once setup works.** It asks first and uses the same safety check as `ha-nova update`.
    - **Fewer prompts in Claude Code: setup can allow HA NOVA's read commands once.** You still confirm every unlock or delete yourself.
    - **Long changes from other AI apps on your computer keep running past the app's time limit.** That covers apps added through setup's "Other AI apps" row. Asking again gets the result, and nothing runs twice.

    ## What To Watch

    - **HA NOVA no longer reads Home Assistant's logs, which can hold passwords and keys.** When a log would help, your AI asks you to open Settings > System > Logs and share only the lines that matter.
    - **Writing a file in your Home Assistant config folder, or changing where backups go, now asks for the same confirmation as unlocking a door.**

    ## Bug Fixes

    - **Changes that would drop aliases or labels, a person's trackers, or voice-assistant settings now save a copy first.**
    - **HA NOVA overwrites or deletes a file in your config folder only once a copy of it is saved.** It stops if the file changed since the preview.
    - **Helper and dashboard-name changes are now checked before they are saved, and a helper change can be undone.**
    - **Reloading an automation or your scripts is now checked like what it loads.** A harmless reload no longer asks like unlocking a door; one that can unlock still does. A change also checks what its reload sets off.
    - **When the NOVA App refuses a file (for example anything under /config/www), HA NOVA now says why instead of reporting a sign-in problem.**
    - **Over Home Assistant Link, `ha-nova update` now says when the NOVA App needs an update.** Update it in Home Assistant: Settings > Apps > NOVA Relay > Update.

    Stable install commands are release-pinned for this tag.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows 11 on ARM, install from the x64 PowerShell; the installer lists the steps.
    Windows uses a single supported install path: `install.ps1`.
    Do not download and run the raw `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets directly; those are installer payloads, not the supported end-user path.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
    {{ end }}
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
