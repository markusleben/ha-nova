version: 2

project_name: ha-nova

builds:
  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - cloudremote_official
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  # The curated release header below is the complete user-facing changelog.
  # Appending commit-derived groups duplicates headings and can displace the
  # intended bug-fix highlights in the installed update digest.
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  # Keep every asset invisible until release.yml has built and uploaded the
  # complete installer set. Failed jobs replace this draft on retry; only the
  # separate final publish job makes it public.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  mode: replace
  name_template: "HA NOVA v{{.Version}}"
  header: |
    {{ if .Prerelease }}## Preview / Release Candidate

    This is a release candidate for installer and onboarding testing. Stable users should ignore this prerelease; normal `ha-nova update` stays on stable.

    Install this exact RC (release-pinned for this tag):

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows uses a single supported install path: `install.ps1`. Return an RC install to stable later with `ha-nova update`; if it reports that it needs admin rights, rerun the stable Windows install command instead.
    {{ else }}**Update the NOVA App to 0.13.19.** It brings the fixes below to Claude and ChatGPT, and HA NOVA on your computer asks for it too.

    - In Home Assistant: Settings > Apps > NOVA Relay > Update.
    - A big change you previewed before the update may need a new preview.

    ## What To Watch

    - **Shortening a repeating calendar event takes your own confirmation, like a delete.** Fewer dates, an earlier end, or a new start for this and later dates: Home Assistant can then remove more dates than the change names.
    - **A shopping-list reorder goes on its own.** Together with renaming a list or turning one on, it could skip HA NOVA's check of what listens to the list. HA NOVA now asks you to make the other changes first.

    ## Bug Fixes

    - **Works with Home Assistant 2026.11's Marketplace.** 2026.11 builds HACS in as the Marketplace. HA NOVA no longer says HACS is missing: it shows what's installed and the steps in Home Assistant for the rest.
    - **Confirmations over Home Assistant Link no longer give up after 5 s.** When a change you confirmed never reached Home Assistant, HA NOVA now says so: nothing changed.
    - **Changes to an automation many others react to go through.** They no longer fail with "something changed since the preview" every time. A change in what the preview checked still needs a new one.
    - **Changing a dropdown helper or a schedule keeps its other options and times.** If the AI sent only the new ones, the rest could drop out. A change that removes some now saves a copy of the helper first.
    - **Passwords stay out of App settings and saved web addresses.** HA NOVA refuses a password or key it recognizes in an App's settings, Home Assistant's own URLs, or a blueprint's source address.
    - **Calendar previews describe repeating events correctly.** A preview no longer says an edit removes an event's repetition when it doesn't.
    - **Security updates.** HA NOVA and the chat-app part of the NOVA App are built with Go 1.26.10, which closes known security holes in web, encryption and network code.

    Stable install commands are release-pinned for this tag.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows 11 on ARM, install from the x64 PowerShell; the installer lists the steps.
    Windows uses a single supported install path: `install.ps1`.
    Do not download and run the raw `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets directly; those are installer payloads, not the supported end-user path.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
    {{ end }}
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
