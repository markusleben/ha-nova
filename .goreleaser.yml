version: 2

project_name: ha-nova

builds:
  - id: ha-nova-darwin
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "
  groups:
    - title: New Features
      regexp: '^feat(\(.+\))?!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^fix(\(.+\))?!?:.+$'
      order: 10
    - title: UX, Docs, and Refactors
      regexp: '^(docs|refactor|perf|style)(\(.+\))?!?:.+$'
      order: 20
    - title: Internal Maintenance
      regexp: '^(build|ci|chore|test)(\(.+\))?!?:.+$'
      order: 30
    - title: Other Changes
      order: 999

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  draft: false
  prerelease: auto
  name_template: "HA NOVA v{{.Version}}"
  header: |
    ## Why This Release Exists

    This release keeps HA NOVA easier to install, safer to update, and clearer to operate across supported platforms.
    Read the grouped sections below for the user-facing changes, fixes, and upgrade notes.

    ## What You Get

    - user-visible features grouped under `New Features`
    - bug fixes grouped under `Bug Fixes`
    - UX, docs, and cleanup grouped separately so maintainers can scan them without burying product changes

    ## Install or Update

    Do not download the `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets below and try to run them directly.
    They are installer payloads, not standalone apps.
    Use the installer commands below, or run `ha-nova update` from an existing install.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/main/install.sh | bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $ProgressPreference = 'SilentlyContinue'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/main/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows ARM64, use x64 emulation.
    Windows validation in this release may still be narrower than macOS; check the README support matrix before claiming client-lane parity.
    A `winget` manifest is attached as a release handoff artifact, but the public Windows package is not live until that manifest is published and proven on a fresh Windows VM.

    ## Upgrade Notes

    Already installed? Run `ha-nova check-update` or `ha-nova update`.
    Default `ha-nova uninstall` is standard remove. Use `ha-nova uninstall --purge` for a full local wipe.
    Current Windows installs use `%APPDATA%\ha-nova` and `%LOCALAPPDATA%\ha-nova\cache` as the canonical config/cache locations.
    Keep exactly one Windows install channel per machine. `install.ps1` will not install on top of an existing `winget` install.
    Legacy pre-Go installs still require the legacy cleanup script before reinstalling.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
