version: 2

project_name: ha-nova

builds:
  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - cloudremote_official
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  # The curated release header below is the complete user-facing changelog.
  # Appending commit-derived groups duplicates headings and can displace the
  # intended bug-fix highlights in the installed update digest.
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  # Keep every asset invisible until release.yml has built and uploaded the
  # complete installer set. Failed jobs replace this draft on retry; only the
  # separate final publish job makes it public.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  mode: replace
  name_template: "HA NOVA v{{.Version}}"
  header: |
    {{ if .Prerelease }}## Preview / Release Candidate

    This is a release candidate for installer and onboarding testing. Stable users should ignore this prerelease; normal `ha-nova update` stays on stable.

    Install this exact RC (release-pinned for this tag):

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows uses a single supported install path: `install.ps1`. Return an RC install to stable later with `ha-nova update`; if it reports that it needs admin rights, rerun the stable Windows install command instead.
    {{ else }}**Update the NOVA App to 0.13.27.** Much of this release runs in the App, so update it and HA NOVA on every computer together. Claude and ChatGPT get this release's changes through the App.

    - In Home Assistant: Settings > Apps > NOVA Relay > Update.
    - No Update button yet? In Home Assistant: Settings > ⋮ (top right) > Check for updates. Or, at home, run `ha-nova doctor`: it does that for you and offers the update.
    - Then run `ha-nova update` on each computer.
    - Standalone container: pull the new image and recreate the container.
    - Using HA NOVA in ChatGPT? After the update, open chatgpt.com/plugins, choose HA NOVA, then Refresh.

    ## New Features

    - **HA NOVA now installs, updates, and removes Marketplace items, each after your OK (Home Assistant 2026.11+).** With the NOVA App, it first asks you to accept Home Assistant's Marketplace notice for the App's user.
    - **Ask "Can I update now?" and get a checked answer.** HA NOVA checks that your home is ready, suggests an order, matches Home Assistant's breaking changes to your integrations, and says afterwards what changed.
    - **A system check-up says whether Home Assistant is OK, why it is slow, and whether your backup would work.** It only reads, and says what it couldn't check.
    - **See which integration keeps failing, without HA NOVA reading the log.** It counts the log entries per integration and level, and since when; the lines stay in Home Assistant.
    - **Every Home Assistant administrator can use the NOVA page:** connect a computer with a code, revoke one, and approve. Chat-app settings stay with the owner.
    - **A clearer NOVA page and approval page that update on their own.** A waiting request sits on top; the approval page shows a countdown, with Approve and Cancel side by side.
    - **The window on your computer opens the request in Home Assistant.** Its button opens exactly this request on the NOVA approval page, where you approve it.
    - **Your phone asks sooner.** An unlock rings your phone before HA NOVA's full check of your home; the check runs right after your OK, and nothing is sent unless both pass.
    - **Chat apps on the standalone container ask the phone linked to it** instead of refusing a change that needs an OK. With no phone linked there, it is still refused.
    - **In chat apps, reading your home no longer waits for a change in progress.**
    - **New automations use Home Assistant's newer room, floor, and label triggers.**
    - **A helper made through its setup form is now checked by HA NOVA itself:** that it loaded, its entities, and its settings.

    ## What To Watch

    - **Phone asks pause less often, and you can end a pause.** They pause after five unanswered asks in a row, for 5 minutes (before: three, for 15). "Ask on the phone again" on the NOVA page ends it.
    - **More changes ask when an automation would react to them.** Renaming an entity onto a replaced one's id, or moving something into an area, floor, or label, asks when such an automation unlocks something.

    ## Bug Fixes

    - **In homes with thousands of entities, everyday changes such as a light no longer all ask on the phone.** The NOVA App's safety check now reads the full entity list of a large home.
    - **Fewer phone asks in homes with a thermostat or hygrostat made in Home Assistant's UI.** Everyday changes such as a light run without an ask again.
    - **The guided NOVA App update now asks for your OK instead of refusing** in homes with automations that react to actions.
    - **After `ha-nova update`, the NOVA App check no longer hangs.** It shows progress and gives up after 10 seconds, pointing to `ha-nova doctor`.
    - **Windows: `ha-nova update` retries a briefly locked install folder** instead of failing with "access denied".
    - **Chat apps check a user's role again right before a change their phone approved.**

    Stable install commands are release-pinned for this tag.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows 11 on ARM, install from the x64 PowerShell; the installer lists the steps.
    Windows uses a single supported install path: `install.ps1`.
    Do not download and run the raw `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets directly; those are installer payloads, not the supported end-user path.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
    {{ end }}
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
