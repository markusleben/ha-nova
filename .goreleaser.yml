version: 2

project_name: ha-nova

builds:
  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - cloudremote_official
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  # The curated release header below is the complete user-facing changelog.
  # Appending commit-derived groups duplicates headings and can displace the
  # intended bug-fix highlights in the installed update digest.
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  # Keep every asset invisible until release.yml has built and uploaded the
  # complete installer set. Failed jobs replace this draft on retry; only the
  # separate final publish job makes it public.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  mode: replace
  name_template: "HA NOVA v{{.Version}}"
  header: |
    {{ if .Prerelease }}## Preview / Release Candidate

    This is a release candidate for installer and onboarding testing. Stable users should ignore this prerelease; normal `ha-nova update` stays on stable.

    Install this exact RC (release-pinned for this tag):

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows uses a single supported install path: `install.ps1`. Return an RC install to stable later with `ha-nova update`; if it reports that it needs admin rights, rerun the stable Windows install command instead.
    {{ else }}**Update the NOVA App to 0.13.29.** Much of this release runs in the App, so update it and HA NOVA on every computer together. Claude and ChatGPT get this release's changes through the App.

    - In Home Assistant: Settings > Apps > NOVA Relay > Update.
    - No Update button yet? In Home Assistant: Settings > ⋮ (top right) > Check for updates. Or, at home, run `ha-nova doctor`: it does that for you and offers the update.
    - Then run `ha-nova update` on each computer.
    - Standalone container: pull the new image and recreate the container.

    ## New Features

    - **Updating a Mac from 0.31? HA NOVA asks you to pair it again once.** It's one Home Assistant sign-in, about a minute (with Home Assistant Link at home, a second one for Link). Run `ha-nova setup` when HA NOVA says so.
    - **An open logbook no longer makes an everyday call ask.** A logbook or an entity's history open on a tablet or in the app made every device call ask. Now each call is rated by what it does.
    - **Your phone is offered wherever this computer can't confirm in its window.** Over SSH, with no screen, or after a no to one-click confirming, setup and `ha-nova pair` in a terminal offer it until one is linked.
    - **A computer nobody sits at can confirm with a four-digit code in your AI chat.** The Home Assistant owner turns it on per computer on the NOVA page, instead of one-click. It's off by default; a linked phone ends it.
    - **A computer whose keyring can't be unlocked pairs without starting over.** Setup and `ha-nova pair` in a terminal offer a private key file in the same run (Enter is no).
    - **`ha-nova setup --server <name>` opens the setup page** for a server already paired on this computer, where setup can open a browser, and keeps your AI app choices.

    ## What To Watch

    - **Updating a Mac from 0.31? HA NOVA asks you to pair it again once.** The first command that needs it names the step: `ha-nova setup`, or `ha-nova setup --server <name>` for another server.
    - **On a Mac that used Home Assistant Link, setup signs the old version out of Link.** macOS asks for your password once per old sign-in: choose "Allow", not "Always Allow".
    - **A computer paired before 0.32 pairs again once to confirm with one click.** Until then, its window only waits.
    - **One-click confirming trusts that computer.** On Windows and Linux, any program running as you could confirm without a click.
    - **Your AI assistant sees the chat code too, and HA NOVA can't tell who typed it.** So can any program using this computer's key. Use a private chat only you can write in; a linked phone is safer.
    - **The chat code needs the new App and HA NOVA, and works where your AI runs `ha-nova apply`.** Other routes, and a later step of the same change, ask on the phone or the NOVA page.
    - **Update the NOVA App and HA NOVA together.** HA NOVA 0.32 refuses a change it would ask for but the new App wouldn't; the old App still asks for one the new HA NOVA wouldn't. Update both, then retry.
    - **A listener HA NOVA can't name on the logbook's events no longer makes a call ask.** A logbook view is one. A custom integration or an outside script that answers device calls with calls of its own isn't followed.
    - **A key kept in a file trusts every program running as you.** Any of them can read it, and this computer then never confirms in its window. A Mac's Keychain key is never copied into the file.

    ## Bug Fixes

    - **When the NOVA page is the only place to confirm, HA NOVA points you there**, not to a phone that isn't linked, and says how to link one.
    - **Setup removes the old Link sign-in's Keychain copy once the App records the sign-out.** If that fails, setup tries again and `ha-nova doctor` says so. A copy left by 0.32 stays.
    - **The browser setup re-run shows the Link sign-out's result right away**, and keeps it when you quit.
    - **Setup no longer says Link access was removed while it reconnects Link.**
    - **A failed answer from the NOVA App is never read as success**, and a failed Link sign-out check names its cause.

    Stable install commands are release-pinned for this tag.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows 11 on ARM, install from the x64 PowerShell; the installer lists the steps.
    Windows uses a single supported install path: `install.ps1`.
    Do not download and run the raw `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets directly; those are installer payloads, not the supported end-user path.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
    {{ end }}
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
