version: 2

project_name: ha-nova

builds:
  - id: ha-nova-darwin
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "
      - '^(docs|refactor|perf|style|build|ci|chore|test)(\(.+\))?!?:.+$'
  groups:
    - title: New Features
      regexp: '^feat(\(.+\))?!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^fix(\(.+\))?!?:.+$'
      order: 10

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  draft: false
  prerelease: auto
  name_template: "HA NOVA v{{.Version}}"
  header: |
    {{ if .Prerelease }}## Preview / Release Candidate

    This is a release candidate for installer and onboarding testing. Stable users should ignore this prerelease; normal `ha-nova update` stays on stable.

    Install this exact RC (release-pinned for this tag):

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows uses a single supported install path: `install.ps1`. Return an RC install to stable later with `ha-nova update`.
    {{ else }}## New Features

    - **Connect more than one Home Assistant.** Named server profiles in one install, each with its own isolated device credential. Existing setups migrate automatically — nothing re-pairs. Commands: see Upgrade Notes.
    - **Update notices tell you why.** Available updates now show the top release highlights (action-needed first) and a link to the release notes — across `check-update`, relay nudges, and session start.
    - **One confirmation for one logical change.** A multi-step change (up to 10 non-destructive operations) shows every preview first and asks for exactly one confirmation at the end. Deletes keep their own confirmation codes; every step still verifies individually.
    - **Your earlier decisions stay binding.** In long multi-step tasks the AI tracks what you required, chose, and rejected — a plan that would contradict an earlier requirement is blocked and explained, never silently applied.
    - **Button remaps check reality first, and repurposing an input finds its current consumers.** Gestures are verified against what the device actually supports, and everything still listening to the input (automations, scripts, blueprints) is found before anything is reassigned — unverifiable sources are named instead of ignored.
    - **Service and headless setups pair like everyone else.** `ha-nova setup --service <client>` and the new `ha-nova pair --credential-store=file` keep the device credential in a protected file on machines without a desktop keyring.

    Stable install commands are release-pinned for this tag.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows ARM64, use x64 emulation.
    Windows uses a single supported install path: `install.ps1`.
    Do not download and run the raw `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets directly; those are installer payloads, not the supported end-user path.

    ## Upgrade Notes

    - Your configuration migrates to the new multi-server shape automatically on its first save; your setup becomes the `default` profile and keeps working unchanged — nothing re-pairs, and it still works one release back.
    - Already installed? Run `ha-nova update`, then start a new AI client session. The NOVA Relay App is unchanged in this release — no App update needed if you are already on 0.7.0.
    - This release raises the supported minimum Relay App version to 0.7.0: on older Relay Apps, health checks and doctor now steer you straight to the App update instead of failing with bare auth errors.
    - Service re-setups switch storage: an existing `--service` install that kept its device credential in the desktop keyring moves it to the protected file on its next `setup --service` pairing. The old keyring entry becomes inert; nothing breaks mid-upgrade.
    - `ha-nova setup` now always manages the default server. Add further servers with `ha-nova pair --server <name> --relay-url <url>`, administer them with `ha-nova server list|default|rename|remove`, and select one per command with the `--server` flag on relay calls or the `HA_NOVA_SERVER` environment variable.
    - Legacy pre-Go installs still require the legacy cleanup script before reinstalling.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
    {{ end }}
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
