version: 2

project_name: ha-nova

builds:
  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - cloudremote_official
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  # The curated release header below is the complete user-facing changelog.
  # Appending commit-derived groups duplicates headings and can displace the
  # intended bug-fix highlights in the installed update digest.
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  # Keep every asset invisible until release.yml has built and uploaded the
  # complete installer set. Failed jobs replace this draft on retry; only the
  # separate final publish job makes it public.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  mode: replace
  name_template: "HA NOVA v{{.Version}}"
  header: |
    {{ if .Prerelease }}## Preview / Release Candidate

    This is a release candidate for installer and onboarding testing. Stable users should ignore this prerelease; normal `ha-nova update` stays on stable.

    Install this exact RC (release-pinned for this tag):

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows uses a single supported install path: `install.ps1`. Return an RC install to stable later with `ha-nova update`.
    {{ else }}## What To Watch

    - **Update the NOVA Relay App too.** This release needs Relay 0.9.1: update it under Settings > Apps > NOVA Relay (Container/Core: pull the new image). Until then HA NOVA warns that the Relay is outdated.
    - **Device control has one explicit fast path.** Unambiguous everyday actions run right away and are verified afterwards; everything else shows a preview first. Locks, gates, the alarm, and deletes need a code.
    - **Some YAML-only devices now need a code.** Buttons, switches, and other controls defined in YAML without a `unique_id` (template, command_line, MQTT) cannot be inspected, so using them asks for a confirmation code.
    - **Automation and script deletes take one code per item.** Reverting an update that was changed in the Home Assistant UI since is refused instead of overwriting that edit.
    - **The Census is gone; HA NOVA collects nothing.** The CLI deletes its old local Census state on first run, and `ha-nova census` no longer exists.
    - **Shared legacy access is being retired.** It still works in this release and the next. Re-pair each computer once with `ha-nova pair`, then revoke the old shared access on the NOVA page.

    ## New Features

    - **Device control, sent once and verified.** `ha-nova call` and `ha-nova apply` send each action exactly once and check the result. A confirmed plan is re-checked first: if anything changed, nothing is sent.
    - **Automation and script changes with a real diff.** `ha-nova plan write|delete|revert` shows the exact diff, saves once, reloads, and reads the result back; deletes take a config snapshot first.
    - **Use HA NOVA from local MCP clients.** `ha-nova mcp` offers the same checks as tools to clients without a shell, such as Claude Desktop, and reuses this computer's pairing.
    - **Faster, more reliable Relay App updates.** Installs and updates download a ready image instead of building on your Home Assistant device.
    - **Quick read-only lookups.** `ha-nova find`, `get`, and `history` find entities by name, alias, domain, or current state ("which lights are on?"), read a state or config, and summarize history.

    ## Bug Fixes

    - **YAML and package automations are read properly.** They are read through their loaded config, so one YAML automation without an id no longer forces confirmation codes on unrelated actions.
    - **Honest verification.** When a device does not reach the expected state in time, HA NOVA says so plainly (for example "still locked after 10s") instead of guessing.
    - **The Relay stops hammering a rejected token.** A revoked Home Assistant token no longer causes an endless reconnect loop, and a stalled login can no longer block later requests.
    - **Ready for Home Assistant 2026.9.** Child devices are recognized correctly, and admin-only update actions get a clear explanation instead of an opaque failure.
    - **Headless Linux works end to end.** `ha-nova uninstall --purge` works without an unlocked keyring, and Codex CLI and OpenCode can use `ha-nova setup --service <client>` on headless machines and over SSH.
    - **fish shell support.** The installer puts `ha-nova` on your PATH in fish too, and uninstall removes every PATH entry it added.
    - **Windows updates clean up after themselves.** No leftover updater files in `%TEMP%`, and a failed update launch removes its download.
    - **Setup describes pairing correctly.** The setup intro explains the one-time six-digit code instead of access tokens.

    Stable install commands are release-pinned for this tag.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows ARM64, use x64 emulation.
    Windows uses a single supported install path: `install.ps1`.
    Do not download and run the raw `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets directly; those are installer payloads, not the supported end-user path.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
    {{ end }}
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
