version: 2

project_name: ha-nova

builds:
  - id: ha-nova-darwin
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

  - id: ha-nova-other
    dir: cli
    binary: ha-nova
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [binary]
    name_template: "ha-nova-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "
      - '^(docs|refactor|perf|style|build|ci|chore|test)(\(.+\))?!?:.+$'
  groups:
    - title: New Features
      regexp: '^feat(\(.+\))?!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^fix(\(.+\))?!?:.+$'
      order: 10

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: markusleben
    name: ha-nova
  draft: false
  prerelease: auto
  name_template: "HA NOVA v{{.Version}}"
  header: |
    {{ if .Prerelease }}## Preview / Release Candidate

    This is a release candidate for installer and onboarding testing. Stable users should ignore this prerelease; normal `ha-nova update` stays on stable.

    Install this exact RC (release-pinned for this tag):

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows uses a single supported install path: `install.ps1`. Return an RC install to stable later with `ha-nova update`.
    {{ else }}## New Features

    - **Passwordless onboarding.** On HA OS and Supervised, the NOVA Relay App connects through Home Assistant's own Supervisor access — no Long-Lived Access Token to create, copy, or paste anymore.
    - **Pair each device with one code.** Click "Connect a device" on the new NOVA sidebar page, type the one-time six-digit code, done. Every device gets its own credential over an encrypted, pinned connection (OPAQUE + SPKI-pinned TLS 1.3).
    - **See and revoke your devices.** The NOVA page lists every paired computer — revoke any one with a click. NOVA appears in your sidebar automatically after this update (once; hiding it afterwards is respected).
    - **Works headless.** Servers, containers, LXCs: without a desktop keyring, the device credential falls back to a private file automatically.

    ## Bug Fixes

    - Fresh App installs could fail to start because a required option had no default — fixed.

    Stable install commands are release-pinned for this tag.

    **macOS / Linux:**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.sh | HA_NOVA_VERSION={{ .Tag }} bash
    ```

    **Windows (PowerShell):**
    ```powershell
    $env:HA_NOVA_VERSION = '{{ .Tag }}'
    irm https://raw.githubusercontent.com/markusleben/ha-nova/{{ .Tag }}/install.ps1 | iex
    ```

    Windows currently ships an `amd64` bundle only. On Windows ARM64, use x64 emulation.
    Windows uses a single supported install path: `install.ps1`.
    Do not download and run the raw `ha-nova-installer-bundle-*.tar.gz` / `.zip` assets directly; those are installer payloads, not the supported end-user path.

    ## Upgrade Notes

    - Already installed? Run `ha-nova check-update` or `ha-nova update`, then update the NOVA Relay App to 0.7.0 (Settings > Apps > NOVA Relay) — take a backup before updating, as always. Start a new AI client session afterwards.
    - Your existing shared relay token is migrated automatically on the App's first 0.7.0 start and the stored plaintext is cleared. Legacy access keeps working until you revoke it — nothing breaks mid-upgrade.
    - To finish the move to per-device pairing: run `ha-nova pair` on each computer once (one code each), then revoke the legacy shared access from the NOVA page.
    - App mode no longer needs `HA_LLAT` — that variable now only applies to the standalone Container/Core relay.
    - Default `ha-nova uninstall` is standard remove. Use `ha-nova uninstall --purge` for a full local wipe.
    - Windows now uses `%APPDATA%\ha-nova` and `%LOCALAPPDATA%\ha-nova\cache` as the canonical config and cache paths.
    - Home Assistant Relay setup stays guided in the browser after local install completes; devices pair with a one-time six-digit code.
    - Legacy pre-Go installs still require the legacy cleanup script before reinstalling.

    > The bundle assets below are consumed by the installers automatically. Only use them directly for maintainer-level debugging or raw binary validation.
    {{ end }}
  footer: |
    ---
    **Full documentation:** [github.com/markusleben/ha-nova](https://github.com/markusleben/ha-nova)
