name: Bug report
description: Report a reproducible problem
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: |
        Please run `ha-nova doctor` first and say what it shows.
        Never paste codes, tokens, or passwords.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did or asked, step by step. Include exact commands.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: >-
        HA NOVA version (`ha-nova version`), NOVA App version, Home Assistant
        version, your computer's system, and your AI app (for example Claude
        Code, or Claude or ChatGPT in chat apps).
    validations:
      required: true
