name: Manifest Review Gate

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  manifest-review-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a
        with:
          github-token: ${{ github.token }}

      - name: Enforce manifest review policy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MANIFEST_APPROVERS: markusleben
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          SAFE_MANUAL_DEPENDENCIES: vitest,vite,typescript,tsx,rollup,rolldown,esbuild
        run: |
          set -euo pipefail

          changed_files_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate)"
          mapfile -t changed_files < <(printf '%s' "${changed_files_json}" | jq -r '.[].filename')

          manifest_changed=false
          non_manifest_changed=false
          for changed_file in "${changed_files[@]}"; do
            case "${changed_file}" in
              package.json|package-lock.json)
                manifest_changed=true
                ;;
              *)
                non_manifest_changed=true
                ;;
            esac
          done

          if [[ "${manifest_changed}" != "true" ]]; then
            echo "No package manifest changes detected."
            exit 0
          fi

          manual_dependency=""
          while IFS= read -r dependency_name; do
            dependency_name="$(printf '%s' "${dependency_name}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [[ -z "${dependency_name}" ]]; then
              continue
            fi
            if printf '%s\n' "${SAFE_MANUAL_DEPENDENCIES}" | tr ',' '\n' | grep -Fxq "${dependency_name}"; then
              manual_dependency="${dependency_name}"
              break
            fi
          done < <(printf '%s' "${DEPENDENCY_NAMES}" | tr ',' '\n')

          if [[ "${PR_AUTHOR}" == "dependabot[bot]" && \
                ( "${PACKAGE_ECOSYSTEM}" == "npm" || "${PACKAGE_ECOSYSTEM}" == "npm_and_yarn" ) && \
                "${DEPENDENCY_GROUP}" == "npm-dev-minor-patch" && \
                -z "${manual_dependency}" && \
                "${non_manifest_changed}" != "true" && \
                ( "${UPDATE_TYPE}" == "version-update:semver-minor" || "${UPDATE_TYPE}" == "version-update:semver-patch" ) ]]; then
            echo "Safe Dependabot manifest lane detected."
            exit 0
          fi

          timeline_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json"
          )"
          approver="$(
            printf '%s' "${timeline_json}" | jq -r '
                [
                  .[][]
                  | select(.event == "labeled" and .label.name == "manifest-review:approved")
                ]
                | last
                | .actor.login // ""
              '
          )"
          approval_labeled_at="$(
            printf '%s' "${timeline_json}" | jq -r '
                [
                  .[][]
                  | select(.event == "labeled" and .label.name == "manifest-review:approved")
                ]
                | last
                | .created_at // ""
              '
          )"
          latest_invalidating_at="$(
            printf '%s' "${timeline_json}" | jq -r '
                [
                  .[][]
                  | select(
                      .event == "committed" or
                      .event == "head_ref_force_pushed" or
                      .event == "reopened" or
                      .event == "ready_for_review" or
                      (.event == "unlabeled" and .label.name == "manifest-review:approved")
                    )
                ]
                | last
                | .created_at // ""
              '
          )"

          if [[ -n "${approver}" ]] && \
             printf '%s\n' "${MANIFEST_APPROVERS}" | tr ',' '\n' | grep -qx "${approver}" && \
             [[ -n "${approval_labeled_at}" ]] && \
             [[ -z "${latest_invalidating_at}" || "${approval_labeled_at}" > "${latest_invalidating_at}" ]]; then
            echo "Maintainer manifest-review label present from ${approver}."
            exit 0
          fi

          echo "::error::Package manifest changes require maintainer review. Add the label manifest-review:approved after review from an approved maintainer."
          exit 1
