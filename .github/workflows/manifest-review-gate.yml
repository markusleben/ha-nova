name: Manifest Review Gate

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  manifest-review-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ github.token }}

      - name: Enforce manifest review policy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          POLICY_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          POLICY_FILE="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/policy/repo-policy.json?ref=${POLICY_REF}" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode > "${POLICY_FILE}"
          manifest_label="$(jq -r '.manifest_review.label' "${POLICY_FILE}")"
          mapfile -t manifest_approvers < <(jq -r '.manifest_review.approvers[]' "${POLICY_FILE}")
          mapfile -t manifest_sensitive_files < <(jq -r '.manifest_review.manifest_sensitive_files[]' "${POLICY_FILE}")
          mapfile -t allowed_package_ecosystems < <(jq -r '.dependabot_safe_lane.allowed_package_ecosystems[]' "${POLICY_FILE}")
          dependabot_dependency_group="$(jq -r '.dependabot_safe_lane.dependency_group' "${POLICY_FILE}")"
          mapfile -t allowed_update_types < <(jq -r '.dependabot_safe_lane.allowed_update_types[]' "${POLICY_FILE}")
          mapfile -t safe_manual_dependencies < <(jq -r '.dependabot_safe_lane.manual_review_dependencies[]' "${POLICY_FILE}")

          changed_files_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate)"
          # Include previous_filename so renames of manifest files still count.
          mapfile -t changed_files < <(printf '%s' "${changed_files_json}" | jq -r '.[] | .filename, (.previous_filename // empty)')

          manifest_changed=false
          non_manifest_changed=false
          for changed_file in "${changed_files[@]}"; do
            file_is_manifest=false
            for manifest_sensitive_file in "${manifest_sensitive_files[@]}"; do
              if [[ "${changed_file}" == "${manifest_sensitive_file}" ]]; then
                file_is_manifest=true
                break
              fi
            done

            if [[ "${file_is_manifest}" == "true" ]]; then
              manifest_changed=true
            else
              non_manifest_changed=true
            fi
          done

          if [[ "${manifest_changed}" != "true" ]]; then
            echo "No package manifest changes detected."
            exit 0
          fi

          manual_dependency=""
          while IFS= read -r dependency_name; do
            dependency_name="$(printf '%s' "${dependency_name}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [[ -z "${dependency_name}" ]]; then
              continue
            fi
            if printf '%s\n' "${safe_manual_dependencies[@]}" | grep -Fxq "${dependency_name}"; then
              manual_dependency="${dependency_name}"
              break
            fi
          done < <(printf '%s' "${DEPENDENCY_NAMES}" | tr ',' '\n')

          if [[ "${PR_AUTHOR}" == "dependabot[bot]" ]]; then
            package_ecosystem_allowed=false
            for allowed_package_ecosystem in "${allowed_package_ecosystems[@]}"; do
              if [[ "${PACKAGE_ECOSYSTEM}" == "${allowed_package_ecosystem}" ]]; then
                package_ecosystem_allowed=true
                break
              fi
            done

            update_type_allowed=false
            for allowed_update_type in "${allowed_update_types[@]}"; do
              if [[ "${UPDATE_TYPE}" == "${allowed_update_type}" ]]; then
                update_type_allowed=true
                break
              fi
            done

            if [[ "${package_ecosystem_allowed}" == "true" && \
                  "${DEPENDENCY_GROUP}" == "${dependabot_dependency_group}" && \
                  "${update_type_allowed}" == "true" && \
                  -z "${manual_dependency}" && \
                  "${non_manifest_changed}" != "true" ]]; then
              echo "Safe Dependabot manifest lane detected."
              exit 0
            fi
          fi

          if [[ "${PR_AUTHOR}" == "dependabot[bot]" ]]; then
            echo "::notice::Dependabot PR did not qualify for the safe manifest lane."
          fi

          if [[ "${manifest_changed}" != "true" ]]; then
            echo "No package manifest changes detected."
            exit 0
          fi

          # Compare TIMELINE ORDER, not timestamps: GitHub appends timeline
          # events chronologically server-side, while commit author/committer
          # dates are user-controlled (rebases and cherry-picks keep old
          # dates). The label event must come after the last invalidating
          # event in the timeline itself.
          timeline_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json"
          )"
          label_state="$(
            printf '%s' "${timeline_json}" | jq -r --arg approval_label "${manifest_label}" '
                [ .[][] ] as $events
                | ($events
                    | map(.event == "labeled" and (.label.name // "") == $approval_label)
                    | rindex(true)) as $label_idx
                | ($events
                    | map(
                        .event == "committed" or
                        .event == "head_ref_force_pushed" or
                        .event == "reopened" or
                        .event == "ready_for_review" or
                        (.event == "unlabeled" and (.label.name // "") == $approval_label)
                      )
                    | rindex(true)) as $invalidating_idx
                | {
                    approver: (if $label_idx != null then ($events[$label_idx].actor.login // "") else "" end),
                    current: ($label_idx != null and ($invalidating_idx == null or $label_idx > $invalidating_idx))
                  }
                | "\(.approver)\t\(.current)"
              '
          )"
          approver="${label_state%%$'\t'*}"
          label_current="${label_state##*$'\t'}"

          if [[ -n "${approver}" ]]; then
            approver_allowed=false
            for allowed_approver in "${manifest_approvers[@]}"; do
              if [[ "${approver}" == "${allowed_approver}" ]]; then
                approver_allowed=true
                break
              fi
            done
          else
            approver_allowed=false
          fi

          if [[ "${approver_allowed}" == "true" ]] && [[ "${label_current}" == "true" ]]; then
            echo "Maintainer manifest-review label present from ${approver}."
            exit 0
          fi

          echo "::error::Package manifest changes require maintainer review. Add the label ${manifest_label} after review from an approved maintainer."
          exit 1
