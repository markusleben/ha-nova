name: Dependabot Safe Auto-Merge

on:
  check_run:
    types:
      - completed
  repository_dispatch:
    types:
      - dependabot-safe-reevaluate
  workflow_run:
    workflows:
      - CI
      - CodeQL
      - Dependency Review
      - Manifest Review Gate
      - README Release Gate
    types:
      - completed

permissions: {}

jobs:
  resolve-trigger:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_run' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')) ||
      (github.event_name == 'check_run' &&
      github.event.check_run.name == 'cloud-source-gate')
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      policy-ref: ${{ steps.trigger.outputs.policy-ref }}
      policy-sha: ${{ steps.trigger.outputs.policy-sha }}
      run-id: ${{ steps.trigger.outputs.run-id }}
      run-kind: ${{ steps.trigger.outputs.run-kind }}
      run-sha: ${{ steps.trigger.outputs.run-sha }}
      should-process: ${{ steps.trigger.outputs.should-process }}
    steps:
      - name: Authenticate trusted completion trigger
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          trusted_ref="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${POLICY_REF}" --jq '.sha'
          )"
          [[ "${trusted_ref}" =~ ^[0-9a-f]{40}$ ]]
          TRIGGER_DIR="$(mktemp -d)"
          POLICY_FILE="${TRIGGER_DIR}/repo-policy.json"
          TRIGGER_SCRIPT="${TRIGGER_DIR}/resolve-dependabot-auto-merge-trigger.mjs"
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/policy/repo-policy.json?ref=${trusted_ref}" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode > "${POLICY_FILE}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/release/resolve-dependabot-auto-merge-trigger.mjs?ref=${trusted_ref}" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode > "${TRIGGER_SCRIPT}"
          node "${TRIGGER_SCRIPT}" "${POLICY_FILE}"
          echo "policy-ref=${trusted_ref}" >> "${GITHUB_OUTPUT}"

  enable-safe-auto-merge:
    needs: resolve-trigger
    if: ${{ needs.resolve-trigger.outputs.should-process == 'true' }}
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Merge safe Dependabot PRs after all required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ needs.resolve-trigger.outputs.run-id }}
          RUN_KIND: ${{ needs.resolve-trigger.outputs.run-kind }}
          RUN_SHA: ${{ needs.resolve-trigger.outputs.run-sha }}
          AUTHENTICATED_POLICY_REF: ${{ needs.resolve-trigger.outputs.policy-ref }}
          EXPECTED_POLICY_SHA: ${{ needs.resolve-trigger.outputs.policy-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          [[ "${AUTHENTICATED_POLICY_REF}" =~ ^[0-9a-f]{40}$ ]]
          MERGE_DIR="$(mktemp -d)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/release/merge-safe-dependabot-pr.mjs?ref=${AUTHENTICATED_POLICY_REF}" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode > "${MERGE_DIR}/merge-safe-dependabot-pr.mjs"
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/release/dependabot-direct-merge-github.mjs?ref=${AUTHENTICATED_POLICY_REF}" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode > "${MERGE_DIR}/dependabot-direct-merge-github.mjs"
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/release/dependabot-direct-merge-policy.mjs?ref=${AUTHENTICATED_POLICY_REF}" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode > "${MERGE_DIR}/dependabot-direct-merge-policy.mjs"
          node "${MERGE_DIR}/merge-safe-dependabot-pr.mjs"
