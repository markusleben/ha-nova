name: Dependabot Safe Auto-Merge

on:
  workflow_run:
    workflows:
      - CI
      - CodeQL
      - Dependency Review
      - Manifest Review Gate
    types:
      - completed

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

env:
  SAFE_POLICY_MARKER: "<!-- ha-nova-dependabot-safe-policy -->"

jobs:
  enable-safe-auto-merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge safe Dependabot PRs after all required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          POLICY_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          POLICY_FILE="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/policy/repo-policy.json?ref=${POLICY_REF}" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode > "${POLICY_FILE}"
          safe_label="$(jq -r '.dependabot_safe_lane.label' "${POLICY_FILE}")"
          mapfile -t required_checks < <(jq -r '.main_branch_protection.required_status_checks[]' "${POLICY_FILE}")
          policy_sha="$(sha256sum "${POLICY_FILE}" | awk '{print $1}')"

          prs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[].number')"
          if [[ -z "${prs}" ]]; then
            echo "No PRs attached to workflow run."
            exit 0
          fi

          for pr_number in ${prs}; do
            pr_json="$(gh pr view "${pr_number}" --json autoMergeRequest,headRefOid,isDraft,labels,url)"
            pr_sha="$(printf '%s' "${pr_json}" | jq -r '.headRefOid')"
            is_draft="$(printf '%s' "${pr_json}" | jq -r '.isDraft')"
            labels="$(printf '%s' "${pr_json}" | jq -r '.labels[].name')"
            if [[ "${is_draft}" == "true" ]]; then
              continue
            fi
            if [[ "${pr_sha}" != "${RUN_SHA}" ]]; then
              continue
            fi
            if ! printf '%s\n' "${labels}" | grep -qx "${safe_label}"; then
              continue
            fi

            comments_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" --paginate --slurp)"
            policy_comment="$(
              printf '%s' "${comments_json}" | jq -r --arg marker "${SAFE_POLICY_MARKER}" '
                [
                  .[][]
                  | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))
                ]
                | last
                | .body // ""
              '
            )"
            recorded_policy_sha="$(printf '%s\n' "${policy_comment}" | awk -F= '/^policy_sha=/{print $2; exit}')"
            if [[ -z "${recorded_policy_sha}" || "${recorded_policy_sha}" != "${policy_sha}" ]]; then
              echo "Policy fingerprint drifted for PR #${pr_number}; removing safe label."
              if printf '%s' "${pr_json}" | jq -e '.autoMergeRequest != null' >/dev/null; then
                gh pr merge "${pr_number}" --disable-auto >/dev/null || true
              fi
              gh pr edit "${pr_number}" --remove-label "${safe_label}" >/dev/null || true
              continue
            fi

            timeline_json="$(
              gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/timeline" \
                --paginate \
                --slurp \
                -H "Accept: application/vnd.github+json"
            )"
            label_actor="$(
              printf '%s' "${timeline_json}" | jq -r --arg label "${safe_label}" '
                  [
                    .[][]
                    | select((.event == "labeled" or .event == "unlabeled") and .label.name == $label)
                  ]
                  | last
                  | select(.event == "labeled")
                  | .actor.login // ""
                '
            )"
            if [[ "${label_actor}" != "github-actions[bot]" ]]; then
              continue
            fi

            checks_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${pr_sha}/check-runs?per_page=100")"
            for required_check in "${required_checks[@]}"; do
              conclusion="$(printf '%s' "${checks_json}" | jq -r --arg name "${required_check}" '[.check_runs[] | select(.name == $name) | .conclusion] | last // ""')"
              if [[ "${conclusion}" != "success" ]]; then
                echo "Required check ${required_check} not green for PR #${pr_number}; skipping auto-merge."
                continue 2
              fi
            done

            gh pr merge "${pr_number}" --auto --squash
          done
