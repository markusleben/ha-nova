name: Dependabot Safe Lane Prepare

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - unlabeled

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

env:
  SAFE_POLICY_MARKER: "<!-- ha-nova-dependabot-safe-policy -->"

jobs:
  approve-safe-dev-deps:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    steps:
      - name: Capture PR context
        id: pr
        run: |
          set -euo pipefail

          event_path="${GITHUB_EVENT_PATH:-}"
          if [[ -z "${event_path}" || ! -f "${event_path}" ]]; then
            echo "pr-number=" >> "${GITHUB_OUTPUT}"
            echo "pr-author=" >> "${GITHUB_OUTPUT}"
            echo "pr-draft=false" >> "${GITHUB_OUTPUT}"
            echo "pr-base-sha=" >> "${GITHUB_OUTPUT}"
            echo "pr-event-action=" >> "${GITHUB_OUTPUT}"
            echo "pr-event-label=" >> "${GITHUB_OUTPUT}"
            echo "pr-url=" >> "${GITHUB_OUTPUT}"
            echo "should-process=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          pr_number="$(jq -r '.pull_request.number // ""' "${event_path}")"
          pr_author="$(jq -r '.pull_request.user.login // ""' "${event_path}")"
          pr_draft="$(jq -r '.pull_request.draft // false' "${event_path}")"
          pr_base_sha="$(jq -r '.pull_request.base.sha // ""' "${event_path}")"
          pr_event_action="$(jq -r '.action // ""' "${event_path}")"
          pr_event_label="$(jq -r '.label.name // ""' "${event_path}")"
          pr_url="$(jq -r '.pull_request.html_url // ""' "${event_path}")"

          echo "pr-number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "pr-author=${pr_author}" >> "${GITHUB_OUTPUT}"
          echo "pr-draft=${pr_draft}" >> "${GITHUB_OUTPUT}"
          echo "pr-base-sha=${pr_base_sha}" >> "${GITHUB_OUTPUT}"
          echo "pr-event-action=${pr_event_action}" >> "${GITHUB_OUTPUT}"
          echo "pr-event-label=${pr_event_label}" >> "${GITHUB_OUTPUT}"
          echo "pr-url=${pr_url}" >> "${GITHUB_OUTPUT}"
          if [[ "${pr_author}" == "dependabot[bot]" && "${pr_draft}" != "true" ]]; then
            echo "should-process=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should-process=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Fetch Dependabot metadata
        id: metadata
        if: ${{ steps.pr.outputs.should-process == 'true' }}
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Evaluate safe auto-merge lane
        id: guard
        if: ${{ steps.pr.outputs.should-process == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          POLICY_REF: ${{ steps.pr.outputs.pr-base-sha }}
          PR_EVENT_ACTION: ${{ steps.pr.outputs.pr-event-action }}
          PR_EVENT_LABEL: ${{ steps.pr.outputs.pr-event-label }}
        run: |
          set -euo pipefail

          POLICY_FILE="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/policy/repo-policy.json?ref=${POLICY_REF}" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode > "${POLICY_FILE}"
          safe_label="$(jq -r '.dependabot_safe_lane.label' "${POLICY_FILE}")"
          mapfile -t allowed_package_ecosystems < <(jq -r '.dependabot_safe_lane.allowed_package_ecosystems[]' "${POLICY_FILE}")
          dependabot_dependency_group="$(jq -r '.dependabot_safe_lane.dependency_group' "${POLICY_FILE}")"
          mapfile -t allowed_update_types < <(jq -r '.dependabot_safe_lane.allowed_update_types[]' "${POLICY_FILE}")
          mapfile -t safe_manual_dependencies < <(jq -r '.dependabot_safe_lane.manual_review_dependencies[]' "${POLICY_FILE}")
          mapfile -t manifest_sensitive_files < <(jq -r '.manifest_review.manifest_sensitive_files[]' "${POLICY_FILE}")
          actions_dependency_group="$(jq -r '.dependabot_safe_lane.github_actions.dependency_group // ""' "${POLICY_FILE}")"
          mapfile -t actions_allowed_update_types < <(jq -r '.dependabot_safe_lane.github_actions.allowed_update_types[]?' "${POLICY_FILE}")
          actions_workflow_prefix="$(jq -r '.dependabot_safe_lane.github_actions.workflow_file_prefix // ""' "${POLICY_FILE}")"
          policy_sha="$(sha256sum "${POLICY_FILE}" | awk '{print $1}')"

          eligible=false
          reason=""
          manual_dependency=""
          lane=""

          if [[ "${PR_EVENT_ACTION}" == "unlabeled" \
            && "${PR_EVENT_LABEL}" == "${safe_label}" ]]; then
            reason="automation-owned safe label was removed"
          fi

          if [[ -z "${reason}" ]]; then
            for allowed_package_ecosystem in "${allowed_package_ecosystems[@]}"; do
              if [[ "${PACKAGE_ECOSYSTEM}" == "${allowed_package_ecosystem}" ]]; then
                lane="npm"
                break
              fi
            done
            if [[ -z "${lane}" && "${PACKAGE_ECOSYSTEM}" == "github_actions" && -n "${actions_dependency_group}" ]]; then
              lane="actions"
            fi
          fi

          if [[ -z "${reason}" && -z "${lane}" ]]; then
            reason="package ecosystem is not in a safe lane"
          fi

          if [[ -z "${reason}" && "${lane}" == "npm" ]]; then
            update_type_allowed=false
            for allowed_update_type in "${allowed_update_types[@]}"; do
              if [[ "${UPDATE_TYPE}" == "${allowed_update_type}" ]]; then
                update_type_allowed=true
                break
              fi
            done

            if [[ "${DEPENDENCY_GROUP}" != "${dependabot_dependency_group}" ]]; then
              reason="dependency group is not the safe dev-only lane"
            elif [[ "${update_type_allowed}" != "true" ]]; then
              reason="update type is not minor or patch"
            else
              while IFS= read -r dependency_name; do
                dependency_name="$(printf '%s' "${dependency_name}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                if [[ -z "${dependency_name}" ]]; then
                  continue
                fi
                if printf '%s\n' "${safe_manual_dependencies[@]}" | grep -Fxq "${dependency_name}"; then
                  manual_dependency="${dependency_name}"
                  break
                fi
              done < <(printf '%s' "${DEPENDENCY_NAMES}" | tr ',' '\n')

              if [[ -n "${manual_dependency}" ]]; then
                reason="dependency requires manual review due to toolchain risk: ${manual_dependency}"
              fi
            fi
          fi

          if [[ -z "${reason}" && "${lane}" == "actions" ]]; then
            actions_update_type_allowed=false
            for allowed_update_type in "${actions_allowed_update_types[@]}"; do
              if [[ "${UPDATE_TYPE}" == "${allowed_update_type}" ]]; then
                actions_update_type_allowed=true
                break
              fi
            done

            if [[ "${DEPENDENCY_GROUP}" != "${actions_dependency_group}" ]]; then
              reason="dependency group is not the safe actions minor/patch lane"
            elif [[ "${actions_update_type_allowed}" != "true" ]]; then
              reason="update type is not minor or patch"
            fi
          fi

          if [[ -z "${reason}" ]]; then
            changed_files_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate)"
            mapfile -t changed_files < <(printf '%s' "${changed_files_json}" | jq -r '.[] | .filename, (.previous_filename // empty)')
            if [[ ${#changed_files[@]} -eq 0 ]]; then
              reason="no changed files returned by GitHub API"
            elif [[ "${lane}" == "npm" ]]; then
              for changed_file in "${changed_files[@]}"; do
                file_is_manifest=false
                for manifest_sensitive_file in "${manifest_sensitive_files[@]}"; do
                  if [[ "${changed_file}" == "${manifest_sensitive_file}" ]]; then
                    file_is_manifest=true
                    break
                  fi
                done

                if [[ "${file_is_manifest}" != "true" ]]; then
                    reason="changed file outside safe manifest lane: ${changed_file}"
                    break
                fi
              done
            else
              for changed_file in "${changed_files[@]}"; do
                case "${changed_file}" in
                  "${actions_workflow_prefix}"*.yml | "${actions_workflow_prefix}"*.yaml) ;;
                  *)
                    reason="changed file outside workflow lane: ${changed_file}"
                    break
                    ;;
                esac
              done

              if [[ -z "${reason}" ]]; then
                mapfile -t changed_patch_lines < <(printf '%s' "${changed_files_json}" | jq -r '.[].patch // ""' | grep -E '^[+-]' || true)
                if [[ ${#changed_patch_lines[@]} -eq 0 ]]; then
                  reason="no reviewable patch lines returned by GitHub API"
                else
                  for changed_patch_line in "${changed_patch_lines[@]}"; do
                    if ! printf '%s\n' "${changed_patch_line}" | grep -qE '^[+-][[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+[^[:space:]]+([[:space:]]+#.*)?$'; then
                      reason="workflow change beyond uses: version bumps"
                      break
                    fi
                  done
                fi
              fi
            fi
          fi

          if [[ -z "${reason}" ]]; then
            eligible=true
            if [[ "${lane}" == "npm" ]]; then
              reason="safe dev-only npm manifest update"
            else
              reason="safe github-actions uses-only minor/patch update"
            fi
          fi

          echo "eligible=${eligible}" >> "${GITHUB_OUTPUT}"
          echo "policy-sha=${policy_sha}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "safe-label=${safe_label}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Dependabot safe auto-merge"
            echo
            echo "- eligible: ${eligible}"
            echo "- reason: ${reason}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Approve safe Dependabot PR
        if: ${{ steps.guard.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.pr.outputs.pr-url }}
          GUARD_REASON: ${{ steps.guard.outputs.reason }}
        run: |
          set -euo pipefail
          review_decision="$(gh pr view "${PR_URL}" --json reviewDecision --jq '.reviewDecision')"
          if [[ "${review_decision}" != "APPROVED" ]]; then
            gh pr review --approve "${PR_URL}" --body "Safe Dependabot lane: ${GUARD_REASON}."
          fi

      - name: Mark PR for safe auto-merge
        if: ${{ steps.guard.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          SAFE_LABEL: ${{ steps.guard.outputs.safe-label }}
        run: |
          set -euo pipefail
          gh pr edit "${PR_NUMBER}" --add-label "${SAFE_LABEL}"

      - name: Record safe-lane policy fingerprint
        if: ${{ steps.guard.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          SAFE_LABEL: ${{ steps.guard.outputs.safe-label }}
          POLICY_SHA: ${{ steps.guard.outputs.policy-sha }}
        run: |
          set -euo pipefail

          comment_body="$(printf '%s\n%s\n%s\n' \
            "${SAFE_POLICY_MARKER}" \
            "safe_label=${SAFE_LABEL}" \
            "policy_sha=${POLICY_SHA}")"
          comments_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --slurp)"
          comment_id="$(
            printf '%s' "${comments_json}" | jq -r --arg marker "${SAFE_POLICY_MARKER}" '
              [
                .[][]
                | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))
              ]
              | last
              | .id // ""
            '
          )"

          if [[ -n "${comment_id}" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --method PATCH -f body="${comment_body}" >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -f body="${comment_body}" >/dev/null
          fi

      - name: Reevaluate the fully marked safe PR
        if: ${{ steps.guard.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          pr_author="$(jq -r '.user.login // ""' <<<"${pr_json}")"
          pr_head_sha="$(jq -r '.head.sha // ""' <<<"${pr_json}")"
          pr_base_ref="$(jq -r '.base.ref // ""' <<<"${pr_json}")"
          pr_base_repo="$(jq -r '.base.repo.full_name // ""' <<<"${pr_json}")"
          [[ "${pr_author}" == "dependabot[bot]" ]]
          [[ "${pr_head_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${pr_base_ref}" == "main" ]]
          [[ "${pr_base_repo}" == "${GITHUB_REPOSITORY}" ]]

          jq -n \
            --arg event_type "dependabot-safe-reevaluate" \
            --arg pr_number "${PR_NUMBER}" \
            --arg head_sha "${pr_head_sha}" \
            '{
              event_type: $event_type,
              client_payload: {
                pr_number: $pr_number,
                head_sha: $head_sha
              }
            }' \
            | gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
                --method POST \
                --input -

      - name: Remove safe auto-merge marker when lane becomes ineligible
        if: ${{ steps.pr.outputs.should-process == 'true' && steps.guard.outputs.eligible != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          SAFE_LABEL: ${{ steps.guard.outputs.safe-label }}
          POLICY_SHA: ${{ steps.guard.outputs.policy-sha }}
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "${PR_NUMBER}" --json autoMergeRequest,labels)"
          comments_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --slurp)"
          timeline_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json"
          )"
          owned_comment_ids="$(
            printf '%s' "${comments_json}" | jq -r \
              --arg marker "${SAFE_POLICY_MARKER}" \
              --arg label "${SAFE_LABEL}" \
              --arg policy_sha "${POLICY_SHA}" '
              .[][]
              | select(
                  .user.login == "github-actions[bot]"
                  and ((.body | rtrimstr("\n")) == (
                    $marker
                    + "\nsafe_label=" + $label
                    + "\npolicy_sha=" + $policy_sha
                  ))
                )
              | .id
            '
          )"

          bot_label_history="$(
            printf '%s' "${timeline_json}" | jq -r --arg label "${SAFE_LABEL}" '
              any(.[];
                any(.[];
                  .event == "labeled"
                  and .label.name == $label
                  and .actor.login == "github-actions[bot]"
                )
              )
            '
          )"
          bot_auto_merge="$(
            printf '%s' "${pr_json}" \
              | jq -r '.autoMergeRequest.enabledBy.login == "github-actions[bot]"'
          )"

          if [[ -z "${owned_comment_ids}" \
            && ! ( "${bot_label_history}" == "true" && "${bot_auto_merge}" == "true" ) ]]; then
            echo "No automation-owned safe state found; leaving PR unchanged."
            exit 0
          fi

          if [[ "${bot_auto_merge}" == "true" ]]; then
            gh pr merge "${PR_NUMBER}" --disable-auto
          fi

          current_labels_json="$(gh pr view "${PR_NUMBER}" --json labels)"
          latest_label_actor="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json" \
              | jq -r --arg label "${SAFE_LABEL}" '
                ([
                  .[][]
                  | select(
                      (.event == "labeled" or .event == "unlabeled")
                      and (.label.name // "") == $label
                    )
                ] | last) as $event
                | if $event.event == "labeled"
                  then ($event.actor.login // "")
                  else ""
                  end
              '
          )"
          if [[ "${latest_label_actor}" == "github-actions[bot]" ]] \
            && printf '%s' "${current_labels_json}" \
              | jq -e --arg label "${SAFE_LABEL}" '.labels[]? | select(.name == $label)' >/dev/null; then
            gh pr edit "${PR_NUMBER}" --remove-label "${SAFE_LABEL}"
          fi

          if [[ -n "${owned_comment_ids}" ]]; then
            while IFS= read -r comment_id; do
              [[ -n "${comment_id}" ]] || continue
              gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --method DELETE >/dev/null
            done <<< "${owned_comment_ids}"
          fi
