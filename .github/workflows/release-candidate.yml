name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a public prerelease with install bundles after smoke passes"
        required: false
        default: false
        type: boolean
      version_tag:
        description: "Prerelease tag to publish, for example v0.1.13-rc1"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-rc-assets:
    name: Build RC artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: cli/go.sum

      - name: Verify repository
        run: npm run verify

      - name: Verify release metadata
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          if [[ -n "${VERSION_TAG}" ]]; then
            bash scripts/release/verify-release-metadata.sh "${VERSION_TAG}"
          else
            bash scripts/release/verify-release-metadata.sh
          fi

      - name: Build raw binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean

      - name: Build install bundles
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          if [[ -n "${VERSION_TAG}" ]]; then
            bash scripts/release/build-install-bundle.sh "${VERSION_TAG#v}"
          else
            bash scripts/release/build-install-bundle.sh
          fi

      - name: Build winget manifests
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          if [[ -n "${VERSION_TAG}" ]]; then
            bash scripts/release/build-winget-manifest.sh "${VERSION_TAG#v}" "${GITHUB_REPOSITORY}" "${VERSION_TAG}"
          else
            bash scripts/release/build-winget-manifest.sh
          fi

      - name: Upload RC artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rc-install-bundles
          path: dist/install-bundles/*

      - name: Upload RC winget manifests
        uses: actions/upload-artifact@v7
        with:
          name: rc-winget-manifests
          path: |
            dist/winget/manifests/**
            dist/winget/*.zip
            dist/winget/*.sha256

  smoke-bundles:
    name: Smoke bundles (${{ matrix.os }})
    needs: build-rc-assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Download RC artifacts
        uses: actions/download-artifact@v8
        with:
          name: rc-install-bundles
          path: dist/install-bundles

      - name: Download RC winget manifests
        uses: actions/download-artifact@v8
        with:
          name: rc-winget-manifests
          path: dist/winget

      - name: Smoke Unix bundles
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            macOS) bundle="dist/install-bundles/ha-nova-installer-bundle-macos-$(uname -m | sed 's/x86_64/amd64/;s/arm64/arm64/').tar.gz" ;;
            Linux) bundle="dist/install-bundles/ha-nova-installer-bundle-linux-$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/;s/arm64/arm64/').tar.gz" ;;
            *) exit 1 ;;
          esac
          workdir="$(mktemp -d)"
          tar -xzf "$bundle" -C "$workdir"
          test -f "$workdir/ha-nova/bundle.json"
          test -x "$workdir/ha-nova/ha-nova"
          "$workdir/ha-nova/ha-nova" version

      - name: Smoke Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workdir = Join-Path $env:RUNNER_TEMP "ha-nova-rc"
          Remove-Item -LiteralPath $workdir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath "dist/install-bundles/ha-nova-installer-bundle-windows-amd64.zip" -DestinationPath $workdir -Force
          if (-not (Test-Path -LiteralPath (Join-Path $workdir "ha-nova\bundle.json"))) {
            throw "bundle.json missing from Windows RC bundle"
          }
          & (Join-Path $workdir "ha-nova\ha-nova.exe") version

      - name: Validate Windows winget manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installerManifest = Get-ChildItem -Path "dist/winget/manifests" -Recurse -Filter "*.installer.yaml" | Select-Object -First 1
          if (-not $installerManifest) {
            throw "winget installer manifest missing from RC artifacts"
          }
          $manifestDir = Split-Path -Parent $installerManifest.FullName
          $output = & winget validate --manifest $manifestDir 2>&1
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            throw "winget validate failed for $manifestDir"
          }
          if (($output | Out-String) -match 'warning') {
            throw "winget validate emitted warnings for $manifestDir"
          }

  publish-rc-release:
    name: Publish RC prerelease
    if: ${{ inputs.publish_release }}
    needs: smoke-bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate RC publish inputs
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${VERSION_TAG}" ]]; then
            echo "::error::version_tag is required when publish_release=true"
            exit 1
          fi
          if [[ ! "${VERSION_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "::error::version_tag must match vX.Y.Z-rcN"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify next release version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.version_tag }}
          HA_NOVA_ALLOW_EXISTING_RELEASE_TAG: "1"
        run: bash scripts/release/verify-next-release-version.sh "${VERSION_TAG}"

      - name: Download RC artifacts
        uses: actions/download-artifact@v8
        with:
          name: rc-install-bundles
          path: dist/install-bundles

      - name: Download RC winget manifests
        uses: actions/download-artifact@v8
        with:
          name: rc-winget-manifests
          path: dist/winget

      - name: Publish install bundles as prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          title="HA NOVA ${VERSION_TAG}"
          install_ref="${GITHUB_SHA}"
          notes=$'Bundle-based release candidate for installer testing.\n\nInstall script ref: '"${install_ref}"$'\n\nmacOS / Linux:\n  curl -fsSL https://raw.githubusercontent.com/markusleben/ha-nova/'"${install_ref}"$'/install.sh | HA_NOVA_VERSION='"${VERSION_TAG}"$' bash\n\nWindows (PowerShell):\n  $env:HA_NOVA_VERSION = '\'''"${VERSION_TAG}"$''\''\n  $ProgressPreference = '\''SilentlyContinue'\''\n  irm https://raw.githubusercontent.com/markusleben/ha-nova/'"${install_ref}"$'/install.ps1 | iex\n\nWindows notes:\n- Public Windows path stays install.ps1 until the winget package is published and proven on a fresh Windows VM.\n- The attached winget manifest artifact is a rehearsal handoff, not a live install channel and not the final public submission payload.\n- Default ha-nova uninstall is standard remove; use ha-nova uninstall --purge for a full local wipe.\n- Windows now uses %APPDATA%\\ha-nova and %LOCALAPPDATA%\\ha-nova\\cache as the canonical config and cache paths.\n- Keep exactly one Windows install channel per machine.\n\nNext step after prerelease publish: use the attached winget artifact only for rehearsal/validation. The real public winget-pkgs submission must be restaged later from the exact final stable release artifact.'
          shopt -s nullglob
          assets=(dist/install-bundles/* dist/winget/*.zip dist/winget/*.sha256)

          if gh release view "${VERSION_TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${VERSION_TAG}" "${assets[@]}" --clobber -R "${GITHUB_REPOSITORY}"
            gh release edit "${VERSION_TAG}" --prerelease --title "${title}" --notes "${notes}" -R "${GITHUB_REPOSITORY}"
            exit 0
          fi

          gh release create "${VERSION_TAG}" \
            "${assets[@]}" \
            --prerelease \
            --title "${title}" \
            --notes "${notes}" \
            --target "${GITHUB_SHA}" \
            -R "${GITHUB_REPOSITORY}"
