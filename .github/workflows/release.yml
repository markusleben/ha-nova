name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  cloud-release-gate:
    name: Verify release publication gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Verify production environment policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/verify-github-production-environment.sh

      - name: Verify release metadata
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: bash scripts/release/verify-release-metadata.sh "${VERSION_TAG}"

      - name: Verify Home Assistant Cloud release gate
        env:
          GH_TOKEN: ${{ github.token }}
          HA_NOVA_CLOUD_GATE_EVIDENCE_JSON: ${{ secrets.HA_NOVA_CLOUD_GATE_EVIDENCE_JSON }}
        run: bash scripts/release/verify-cloud-release-gate.sh

  release:
    name: Build release assets
    needs: cloud-release-gate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag must point to a commit on main. Aborting release."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: cli/go.sum

      - name: Verify repository
        run: npm run verify

      - name: Verify next release version
        env:
          GH_TOKEN: ${{ github.token }}
          HA_NOVA_ALLOW_EXISTING_RELEASE_TAG: "1"
        run: bash scripts/release/verify-next-release-version.sh "${GITHUB_REF_NAME}"

      - name: Detect an already-published retry
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published=false
          release_pages="$(gh api --paginate --slurp 'repos/markusleben/ha-nova/releases?per_page=100')"
          matching="$(jq -c --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag)]' <<<"$release_pages")"
          jq -e 'length <= 1' <<<"$matching" >/dev/null
          if [[ "$(jq 'length' <<<"$matching")" == "1" ]]; then
            if [[ "$(jq -r '.[0].draft' <<<"$matching")" == "false" ]]; then
              bash scripts/release/verify-release-assets.sh "$GITHUB_REF_NAME"
              published=true
            fi
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: GoReleaser
        if: steps.release-state.outputs.published != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "v2.17.0"
          args: release --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # RC and final tags can point at the same commit; without this pin
          # GoReleaser auto-detects the tag and may publish onto the wrong release.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Build install bundles
        if: steps.release-state.outputs.published != 'true'
        env:
          HA_NOVA_CLOUD_RELEASE_SIGNING_KEY_PEM: ${{ secrets.HA_NOVA_CLOUD_RELEASE_SIGNING_KEY_PEM }}
        run: bash scripts/release/build-install-bundle.sh "${GITHUB_REF_NAME#v}"

      - name: Upload install bundles
        if: steps.release-state.outputs.published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/install-bundles/* --clobber

  smoke-release-bundles:
    name: Smoke uploaded release bundles (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and smoke Unix release bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            macOS)
              platform="darwin"
              archive="ha-nova-installer-bundle-macos-$(uname -m | sed 's/x86_64/amd64/;s/arm64/arm64/').tar.gz"
              ;;
            Linux)
              platform="linux"
              archive="ha-nova-installer-bundle-linux-$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/;s/arm64/arm64/').tar.gz"
              ;;
            *) exit 1 ;;
          esac
          workdir="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" \
            --dir "$workdir"
          test -f "$workdir/$archive"
          tar -xzf "$workdir/$archive" -C "$workdir"
          root="$workdir/ha-nova"
          test -f "$root/bundle.json"
          test -x "$root/ha-nova"
          node -e '
            const bundle = require(process.argv[1]);
            if (bundle.version !== process.argv[2].replace(/^v/, "")) {
              throw new Error("release bundle version does not match tag");
            }
          ' "$root/bundle.json" "$GITHUB_REF_NAME"
          "$root/ha-nova" version
          listed="$(
            node -e '
              const metadata = require(process.argv[1]);
              process.stdout.write(String(
                metadata.cloud_remote_enabled === true
                && metadata.cloud_remote_platforms.includes(process.argv[2])
              ));
            ' "$root/version.json" "$platform"
          )"
          if [[ "$listed" == "true" ]]; then
            "$root/ha-nova" internal-cloud-release-check
          elif "$root/ha-nova" internal-cloud-release-check; then
            echo "::error::Unlisted $platform runtime accepted Cloud release provenance."
            exit 1
          fi

      - name: Download and smoke Windows release bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "ha-nova-installer-bundle-windows-amd64.zip"
          $workdir = Join-Path $env:RUNNER_TEMP "ha-nova-release"
          Remove-Item -LiteralPath $workdir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $workdir | Out-Null
          gh release download "$env:GITHUB_REF_NAME" `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern $archive `
            --dir $workdir
          $archivePath = Join-Path $workdir $archive
          if (-not (Test-Path -LiteralPath $archivePath)) {
            throw "Exact Windows release bundle was not downloaded"
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $workdir -Force
          $root = Join-Path $workdir "ha-nova"
          $binary = Join-Path $root "ha-nova.exe"
          $bundlePath = Join-Path $root "bundle.json"
          if (-not (Test-Path -LiteralPath $bundlePath)) {
            throw "bundle.json missing from Windows release bundle"
          }
          $bundle = Get-Content -LiteralPath $bundlePath -Raw | ConvertFrom-Json
          $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($bundle.version -ne $expectedVersion) {
            throw "Windows release bundle version does not match tag"
          }
          & $binary version
          if ($LASTEXITCODE -ne 0) {
            throw "Windows release binary version check failed"
          }
          $metadata = Get-Content -LiteralPath (Join-Path $root "version.json") -Raw | ConvertFrom-Json
          $listed = (
            $metadata.cloud_remote_enabled -eq $true -and
            @($metadata.cloud_remote_platforms) -contains "windows"
          )
          & $binary internal-cloud-release-check
          if ($listed -and $LASTEXITCODE -ne 0) {
            throw "enabled Windows Cloud release provenance check failed"
          }
          if (-not $listed -and $LASTEXITCODE -eq 0) {
            throw "unlisted Windows runtime accepted Cloud release provenance"
          }

  publish-release:
    name: Publish complete release
    needs: smoke-release-bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - name: Checkout release gate
        uses: actions/checkout@v7

      - name: Verify complete draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease)"
          jq -e --arg tag "$GITHUB_REF_NAME" '.tagName == $tag' <<<"$release_json" >/dev/null

          expected_prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            expected_prerelease=true
          fi
          jq -e --argjson expected "$expected_prerelease" '.isPrerelease == $expected' <<<"$release_json" >/dev/null

          bash scripts/release/verify-release-assets.sh "$GITHUB_REF_NAME"

          if [[ "$expected_prerelease" == "true" ]]; then
            if [[ "$(jq -r '.isDraft' <<<"$release_json")" == "true" ]]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag
            else
              echo "Prerelease is already published; verifying idempotent final state."
            fi
          else
            # Re-assert Latest even for a published retry. A prior interrupted or
            # manual recovery must not leave /releases/latest on the old stable.
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --verify-tag
          fi

          published_json="$(gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease)"
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            --argjson expected "$expected_prerelease" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == $expected' \
            <<<"$published_json" >/dev/null

          if [[ "$expected_prerelease" == "false" ]]; then
            latest_tag="$(gh api 'repos/markusleben/ha-nova/releases/latest' --jq '.tag_name')"
            if [[ "$latest_tag" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::Latest stable is $latest_tag, expected $GITHUB_REF_NAME."
              exit 1
            fi
          fi

  smoke-installers:
    name: Post-publish smoke installers (${{ matrix.os }})
    needs: publish-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      HA_NOVA_VERSION: ${{ github.ref_name }}
      HA_NOVA_NO_SETUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Smoke Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash install.sh
          ~/.local/bin/ha-nova version
          ~/.local/bin/ha-nova check-update --quiet
          ~/.local/bin/ha-nova update --version "${HA_NOVA_VERSION#v}"
          ~/.local/bin/ha-nova uninstall --yes

      - name: Smoke Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          $binary = Join-Path $env:LOCALAPPDATA "Programs\ha-nova\ha-nova.exe"
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Expected Windows runtime at $binary"
          }
          & $binary version
          & $binary check-update --quiet
          & $binary update --version "$env:HA_NOVA_VERSION"
          & $binary uninstall --yes
          $installRoot = Join-Path $env:LOCALAPPDATA "Programs\ha-nova"
          $statusMarker = Join-Path $env:LOCALAPPDATA "ha-nova\uninstall-status.json"
          $completed = $false
          for ($i = 0; $i -lt 40; $i++) {
            if (-not (Test-Path -LiteralPath $installRoot) -and -not (Test-Path -LiteralPath $statusMarker)) {
              $completed = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $completed) {
            if (Test-Path -LiteralPath $statusMarker) {
              Get-Content -LiteralPath $statusMarker -Raw | Write-Host
              throw "Windows uninstall did not complete cleanly"
            }
            throw "Windows uninstall did not remove $installRoot"
          }
