name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag must point to a commit on main. Aborting release."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: cli/go.sum

      - name: Verify repository
        run: npm run verify

      - name: Verify release metadata
        run: bash scripts/release/verify-release-metadata.sh "${GITHUB_REF_NAME}"

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build install bundles
        run: bash scripts/release/build-install-bundle.sh "${GITHUB_REF_NAME#v}"

      - name: Build winget manifests
        run: bash scripts/release/build-winget-manifest.sh "${GITHUB_REF_NAME#v}" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}"

      - name: Upload install bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/install-bundles/* --clobber

      - name: Upload winget manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/winget/*.zip dist/winget/*.sha256 --clobber

      - name: Upload release winget manifests artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-winget-manifests
          path: dist/winget/manifests
          if-no-files-found: error

  smoke-installers:
    name: Post-publish smoke installers (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      HA_NOVA_VERSION: ${{ github.ref_name }}
      HA_NOVA_NO_SETUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Smoke Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash install.sh
          ~/.local/bin/ha-nova version
          ~/.local/bin/ha-nova check-update --quiet
          ~/.local/bin/ha-nova update --version "${HA_NOVA_VERSION#v}"
          ~/.local/bin/ha-nova uninstall --yes

      - name: Smoke Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          $binary = Join-Path $env:LOCALAPPDATA "Programs\ha-nova\ha-nova.exe"
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Expected Windows runtime at $binary"
          }
          & $binary version
          & $binary check-update --quiet
          & $binary update --version "$env:HA_NOVA_VERSION"
          & $binary uninstall --yes
          $installRoot = Join-Path $env:LOCALAPPDATA "Programs\ha-nova"
          $statusMarker = Join-Path $env:LOCALAPPDATA "ha-nova\uninstall-status.json"
          $completed = $false
          for ($i = 0; $i -lt 40; $i++) {
            if (-not (Test-Path -LiteralPath $installRoot) -and -not (Test-Path -LiteralPath $statusMarker)) {
              $completed = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $completed) {
            if (Test-Path -LiteralPath $statusMarker) {
              Get-Content -LiteralPath $statusMarker -Raw | Write-Host
              throw "Windows uninstall did not complete cleanly"
            }
            throw "Windows uninstall did not remove $installRoot"
          }

      - name: Download release winget manifests
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: release-winget-manifests
          path: dist/winget

      - name: Validate Windows winget manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installerManifest = Get-ChildItem -Path "dist/winget" -Recurse -Filter "*.installer.yaml" | Select-Object -First 1
          if (-not $installerManifest) {
            throw "winget installer manifest missing from release artifacts"
          }
          $manifestDir = Split-Path -Parent $installerManifest.FullName
          $output = & winget validate --manifest $manifestDir 2>&1
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            throw "winget validate failed for $manifestDir"
          }
          if (($output | Out-String) -match 'warning') {
            throw "winget validate emitted warnings for $manifestDir"
          }
