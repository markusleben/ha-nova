name: Release Pipeline Audit

# Catches release-pipeline drift between releases, so a broken publish path is
# found within a week instead of at the next release. Runs the same contract
# check maintainers run locally (scripts/release/verify-release-pipeline.sh).
#
# Static workflow invariants are always verified. The live tag-ruleset
# structure (active, target, ref, creation rule) is verified with the default
# GITHUB_TOKEN. The no-App-bypass guard additionally needs ruleset write access,
# because GitHub only returns bypass_actors to requesters with write access — so
# without a write-scoped token it is skipped with a notice (the weekly audit
# stays green rather than going red on every run). To verify it here too, add a
# fine-grained PAT with repository "Administration: write" as the
# RELEASE_AUDIT_TOKEN secret. The release preflight enforces the guard via
# HA_NOVA_RELEASE_AUDIT_REQUIRE_BYPASS=1 regardless (see docs/releasing.md).

on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verify release pipeline contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release pipeline contract
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash scripts/release/verify-release-pipeline.sh "${{ github.repository }}"
