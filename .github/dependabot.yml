version: 2
updates:
  # Root and relay share their runtime dependencies, and
  # tests/app/dev-contract.test.ts requires both to resolve the same versions,
  # so one entry covers both directories and group-by moves each dependency in
  # both of them in one PR.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/nova"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The types follow the Node runtime (node:22 images), so a major bump is
      # a deliberate change, not a weekly one.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        group-by: dependency-name
        patterns:
          - "*"
        exclude-patterns:
          - vitest
          - vite
          - typescript
          - tsx
          - rollup
          - rolldown
          - esbuild
        update-types:
          - minor
          - patch
      # Toolchain bumps land as one grouped PR; green CI is the gate (AGENTS.md).
      npm-toolchain-minor-patch:
        patterns:
          - vitest
          - vite
          - typescript
          - tsx
          - rollup
          - rolldown
          - esbuild
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: "/cli"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gomod-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      gomod-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
