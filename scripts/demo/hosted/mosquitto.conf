# Hosted demo broker (replaces the test bed's mosquitto.conf). Two listeners
# on the same port, split by address:
# - 127.0.0.1 inside the container: up.sh's `docker exec mosquitto_pub`
#   seeding (retained discovery) - unreachable from any other container.
# - 10.89.240.3 (fixed, docker-compose.yml): Home Assistant. The ACL lets it
#   read everything but write only the simulated devices' command topics, so
#   `mqtt.publish` (an admin service; every visitor is admin) cannot add,
#   change, or delete discovery entities.
per_listener_settings true
persistence false
log_dest stdout

listener 1883 127.0.0.1
allow_anonymous true

listener 1883 10.89.240.3
allow_anonymous true
acl_file /mosquitto/config/acl
