# HA NOVA hosted demo house. Replaces the test bed's configuration.yaml at boot
# (TESTBED_OVERLAY); the packages, automations, scripts, and scenes are the
# test bed's own plus packages/demo.yaml. Mounted read-only, like packages/.
# Differences: no default_config (it pulls in cloud, discovery, backup UI,
# mobile_app, go2rtc, alerts), only what the house needs, the Caddy proxy
# settings (seeded as .storage/http), and a small recorder.
homeassistant:
  name: NOVA Demo House
  latitude: 52.52
  longitude: 13.405
  elevation: 34
  unit_system: metric
  time_zone: Europe/Berlin
  currency: EUR
  country: DE
  # https://<demo domain> (reset.sh via the compose overlay). Home Assistant
  # names its OAuth metadata (Add to Claude) only for requests to this host;
  # set here, visitors cannot change it.
  external_url: !env_var DEMO_EXTERNAL_URL
  packages: !include_dir_named packages

frontend:
history:
logbook:
energy:
person:
sun:
conversation:
demo:

# No http: block. HA 2026.10 deprecated it (a repair, then a 5-minute trial
# to promote). The proxy settings are seeded as HA's own store instead,
# .storage/http next to this file: forwarded-for trusted only from Caddy
# (10.89.240.2, edge.yml), and no IP bans (HA bans on ANY 401, the demo
# password is public anyway, the owner is local-only; a ban would only lock
# visitors out). demo.mjs setup and guard check exactly these values.

# The hourly reset bounds every store; this keeps the hour itself small.
recorder:
  purge_keep_days: 1
  commit_interval: 5

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

logger:
  default: warning
