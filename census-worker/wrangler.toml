# HA NOVA census worker — one SQLite Durable Object of aggregate counters.
# Privacy posture (PRIVACY.md): request and invocation logs stay OFF; the
# application stores no per-request metadata (including edge IPs).

name = "ha-nova-census"
account_id = "58e387e1204bdfe78781caca64f2cd15"
main = "src/index.ts"
compatibility_date = "2026-07-01"

workers_dev = true

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[version_metadata]
binding = "CF_VERSION_METADATA"

[[durable_objects.bindings]]
name = "CENSUS"
class_name = "CensusCounter"

[[unsafe.bindings]]
name = "CENSUS_PING_RATE_LIMITER"
type = "ratelimit"
namespace_id = "23680021"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "CENSUS_WITHDRAW_RATE_LIMITER"
type = "ratelimit"
namespace_id = "23680022"
simple = { limit = 10, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CensusCounter"]

# Isolated functional-test deployment (#446): a DISTINCT Worker with its own
# Durable Object storage. Census functional checks (ping/dedup/withdraw) run
# only here — production statistics represent voluntary real participants and
# are verified read-only. Deploy with: npx wrangler@4.113.0 deploy --env test --tag <reviewed-sha>
[env.test]
name = "ha-nova-census-test"
workers_dev = true

[env.test.observability]
enabled = false

[env.test.observability.logs]
enabled = false
invocation_logs = false

[env.test.version_metadata]
binding = "CF_VERSION_METADATA"

[[env.test.durable_objects.bindings]]
name = "CENSUS"
class_name = "CensusCounter"

[[env.test.unsafe.bindings]]
name = "CENSUS_PING_RATE_LIMITER"
type = "ratelimit"
namespace_id = "23680031"
simple = { limit = 10, period = 60 }

[[env.test.unsafe.bindings]]
name = "CENSUS_WITHDRAW_RATE_LIMITER"
type = "ratelimit"
namespace_id = "23680032"
simple = { limit = 10, period = 60 }
