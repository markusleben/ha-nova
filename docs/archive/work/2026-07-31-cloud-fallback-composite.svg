<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 640" width="1600" height="640">
  <defs>
    <linearGradient id="star-grad-v3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18BCF2"/>
      <stop offset="45%" stop-color="#8FD9E8"/>
      <stop offset="70%" stop-color="#FFD9A0"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <radialGradient id="core-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE4B5"/>
    </radialGradient>
    <radialGradient id="node-space" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#101B2E"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </radialGradient>
    <!-- the old raster label is slightly soft with a faint halo; match it -->
    <filter id="label-soft" color-interpolation-filters="sRGB" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="halo"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.45" result="soft"/>
      <feComponentTransfer in="halo" result="halo2"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode in="halo2"/><feMergeNode in="soft"/></feMerge>
    </filter>
    <filter id="cover-feather" color-interpolation-filters="sRGB" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <image xlink:href="cloud-fallback-bg-nostar.png" x="0" y="0" width="1600" height="640"/>
  <!-- the background bakes in the old label "Home Assistant Cloud": cover it, then set the new name (render on macOS with rsvg-convert: Avenir Next is a system font there) -->
  <rect x="636" y="24" width="334" height="33" rx="6" fill="#020717" filter="url(#cover-feather)"/>
  <text x="801.5" y="52.5" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="600" fill="#FFFFFF" filter="url(#label-soft)">Home Assistant Link</text>
  <rect x="1352" y="301" width="92" height="92" rx="18" fill="url(#node-space)"/>
  <g transform="translate(1398, 347) scale(0.82)">
    <path d="M0,-45 C5,-12 12,-5 45,0 C12,5 5,12 0,45 C-5,12 -12,5 -45,0 C-12,-5 -5,-12 0,-45 Z" fill="url(#star-grad-v3)"/>
    <circle cx="0" cy="0" r="10" fill="url(#core-grad)"/>
  </g>
</svg>
